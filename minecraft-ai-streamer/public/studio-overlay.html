<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1920, initial-scale=1">
<title>Studio Overlay</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Inter:wght@500;600;700;800&display=swap">
<style>
/* Layout: Standard ist 1080x1920 hochkant (TikTok LIVE): Gift-Leiste oben, Facecam rechts, Untertitel als Sprechblase daneben. 16:9 und Split bleiben wählbar. */
:root {
  color-scheme: dark; /* gleiches Schema wie die einbettende Seite -> iframe bleibt transparent */
  --ink: #f4f7fb;
  --ink-dim: #a9b6c9;
  --glass: rgba(10, 16, 28, .62);
  --glass-edge: rgba(140, 220, 255, .28);
  --cyan: #46e0ff;
  --lime: #9dff6a;
  --gold: #ffd257;
  --red: #ff4d5e;
  --violet: #b18cff;
  --display: 'Chakra Petch', 'Segoe UI', system-ui, sans-serif;
  --body: 'Inter', 'Segoe UI', system-ui, sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 100%; height: 100%; background: transparent; overflow: hidden; }
body { font-family: var(--body); color: var(--ink); }
#stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; }
/* Jedes Widget ist frei platzier- und skalierbar (Designer-Modus) */
.wg { position: absolute; transform-origin: 0 0; }
.wg.off { display: none; }
body.designer #stage { background: repeating-conic-gradient(rgba(255,255,255,.05) 0 25%, rgba(0,0,0,.25) 0 50%) 0 0 / 40px 40px, #10151f; outline: 2px dashed rgba(70, 224, 255, .5); }
body.designer.grid #stage::after { content: ''; position: absolute; inset: 0; pointer-events: none; background: linear-gradient(rgba(70,224,255,.13) 1px, transparent 1px) 0 0 / 20px 20px, linear-gradient(90deg, rgba(70,224,255,.13) 1px, transparent 1px) 0 0 / 20px 20px; }
body.designer .wg { cursor: grab; outline: 2px solid rgba(70, 224, 255, .75); outline-offset: 4px; box-shadow: 0 0 22px rgba(70, 224, 255, .35); touch-action: none; user-select: none; }
body.designer .wg.off { display: block; opacity: .28; outline-style: dashed; }
body.designer .wg.sel { outline-color: var(--gold); box-shadow: 0 0 30px rgba(255, 210, 87, .6); }
body.designer .wg > *:not(.wgTag):not(.wgGrip) { pointer-events: none; }
.wgTag, .wgGrip { display: none; }
body.designer .wgTag { display: block; position: absolute; left: -4px; top: -34px; font: 700 15px var(--display); letter-spacing: .08em; background: var(--cyan); color: #04202a; padding: 3px 10px; border-radius: 6px 6px 0 0; white-space: nowrap; }
body.designer .wg.sel .wgTag { background: var(--gold); }
body.designer .wgGrip { display: block; position: absolute; right: -14px; bottom: -14px; width: 26px; height: 26px; border-radius: 6px; background: var(--gold); border: 3px solid #04202a; cursor: nwse-resize; }
#dz { position: fixed; left: 50%; top: 10px; transform: translateX(-50%); z-index: 50; display: none; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: center; max-width: calc(100% - 20px); padding: 8px 10px; border-radius: 14px; background: rgba(8, 12, 22, .94); border: 1px solid var(--glass-edge); font: 600 13px var(--body); color: var(--ink); box-shadow: 0 10px 30px rgba(0,0,0,.6); }
body.designer #dz { display: flex; }
#dz button { font: inherit; color: var(--ink); background: #1b2635; border: 1px solid #2c3d53; border-radius: 8px; padding: 6px 10px; cursor: pointer; }
#dz button.on { background: var(--cyan); color: #04202a; border-color: transparent; }
#dz button:focus-visible, #dz input:focus-visible { outline: 2px solid var(--gold); outline-offset: 1px; }
#dz .sep { width: 1px; align-self: stretch; background: #2c3d53; }
#dz label { display: flex; align-items: center; gap: 6px; color: var(--ink-dim); }
#dz input[type=range] { width: 120px; accent-color: var(--gold); }
#dzSel { color: var(--gold); font-family: var(--display); min-width: 86px; }

/* ---------- Facecam ---------- */
#cam { width: 360px; height: 452px; }
#camFrame {
  position: absolute; inset: 0; border-radius: 26px; overflow: hidden;
  background: linear-gradient(165deg, rgba(24, 40, 70, .86), rgba(8, 12, 22, .9));
  border: 3px solid var(--edge, rgba(140, 220, 255, .45));
  box-shadow: 0 0 0 1px rgba(0, 0, 0, .55), 0 0 30px var(--glow, rgba(70, 224, 255, .35)), inset 0 0 44px var(--inner, rgba(70, 224, 255, .08));
  transition: box-shadow .25s, border-color .25s;
}
#camFrame::before { /* Scan-Raster wie bei einer echten Kamera */
  content: ''; position: absolute; inset: 0; pointer-events: none; z-index: 3;
  background: repeating-linear-gradient(0deg, rgba(255, 255, 255, .03) 0 1px, transparent 1px 4px);
}
#camGlow { position: absolute; inset: 0; z-index: 1; background: radial-gradient(120% 80% at 50% 112%, var(--glow, rgba(70, 224, 255, .3)), transparent 62%); transition: background .3s; }
#camRays { position: absolute; inset: -40%; z-index: 1; opacity: 0; background: repeating-conic-gradient(from 0deg at 50% 62%, rgba(255, 255, 255, .11) 0 7deg, transparent 7deg 18deg); animation: rays 9s linear infinite; transition: opacity .3s; }
@keyframes rays { to { transform: rotate(360deg); } }
#skin { position: absolute; inset: 0; width: 100% !important; height: 100% !important; z-index: 2; transition: filter .4s; }
#camFlash { position: absolute; inset: 0; z-index: 4; background: radial-gradient(circle, rgba(255, 60, 80, .15), rgba(255, 30, 60, .7)); opacity: 0; pointer-events: none; }
#camVig { position: absolute; inset: 0; z-index: 4; pointer-events: none; opacity: 0; transition: opacity .3s; box-shadow: inset 0 0 70px 18px var(--vig, rgba(255, 40, 60, .7)); }
#camFx { position: absolute; inset: 0; z-index: 4; pointer-events: none; overflow: hidden; }
#camFx span { position: absolute; font-size: 38px; line-height: 1; filter: drop-shadow(0 2px 4px rgba(0, 0, 0, .6)); animation: fxRise var(--d, 1.3s) ease-out forwards; }
#camFx span.pop { animation: fxPop .7s cubic-bezier(.2, 1.6, .4, 1) forwards; font-size: 54px; }
#camFx span.fall { animation: fxFall 1s ease-in forwards; font-size: 26px; }
@keyframes fxRise { 0% { opacity: 0; transform: translate(0, 10px) scale(.5) rotate(var(--r0, 0deg)); } 18% { opacity: 1; } 100% { opacity: 0; transform: translate(var(--dx, 0), -150px) scale(1.25) rotate(var(--r1, 20deg)); } }
@keyframes fxPop { 0% { opacity: 0; transform: scale(.2) rotate(-25deg); } 30% { opacity: 1; transform: scale(1.3) rotate(8deg); } 75% { opacity: 1; transform: scale(1) rotate(0); } 100% { opacity: 0; transform: scale(.8); } }
@keyframes fxFall { 0% { opacity: 0; transform: translateY(-6px); } 20% { opacity: 1; } 100% { opacity: 0; transform: translateY(120px); } }
/* Stimmungen färben Rahmen, Licht und Vignette */
#cam.speaking { --edge: rgba(157, 255, 106, .8); --glow: rgba(157, 255, 106, .42); --inner: rgba(157, 255, 106, .1); }
#cam[data-mood=happy] { --edge: rgba(255, 210, 87, .95); --glow: rgba(255, 210, 87, .55); --inner: rgba(255, 210, 87, .14); }
#cam[data-mood=happy] #camRays { opacity: 1; }
#cam[data-mood=angry] { --edge: rgba(255, 120, 60, .95); --glow: rgba(255, 90, 50, .6); --inner: rgba(255, 80, 40, .16); --vig: rgba(255, 70, 30, .55); }
#cam[data-mood=furious] { --edge: #ff2b3f; --glow: rgba(255, 30, 50, .85); --inner: rgba(255, 30, 50, .25); --vig: rgba(255, 20, 40, .8); }
#cam[data-mood=angry] #camVig { opacity: .7; }
#cam[data-mood=furious] #camVig { opacity: 1; animation: vigPulse .45s ease-in-out infinite alternate; }
#cam[data-mood=furious] #camFrame { animation: rage .16s linear infinite; }
#cam[data-mood=scared] { --edge: rgba(120, 190, 255, .95); --glow: rgba(90, 150, 255, .6); --inner: rgba(90, 150, 255, .16); --vig: rgba(40, 80, 200, .65); }
#cam[data-mood=scared] #camVig { opacity: .85; }
#cam[data-mood=scared] #camFrame { animation: tremble .12s linear infinite; }
#cam[data-mood=sad] { --edge: rgba(150, 165, 190, .7); --glow: rgba(120, 135, 160, .3); --inner: rgba(0, 0, 0, .25); --vig: rgba(10, 20, 40, .85); }
#cam[data-mood=sad] #camVig { opacity: 1; }
#cam[data-mood=sad] #skin { filter: saturate(.45) brightness(.82); }
#cam[data-mood=sleep] { --edge: rgba(150, 130, 255, .7); --glow: rgba(120, 100, 255, .35); --vig: rgba(10, 10, 50, .8); }
#cam[data-mood=sleep] #camVig { opacity: .9; }
#cam[data-mood=sleep] #skin { filter: brightness(.7) saturate(.8); }
@keyframes vigPulse { from { opacity: .65; } to { opacity: 1; } }
@keyframes rage { 0% { transform: translate(-3px, 1px) rotate(-.5deg); } 25% { transform: translate(3px, -2px) rotate(.5deg); } 50% { transform: translate(-2px, 2px) rotate(-.3deg); } 75% { transform: translate(2px, 1px) rotate(.4deg); } 100% { transform: translate(-3px, -1px) rotate(-.5deg); } }
@keyframes tremble { 0% { transform: translate(-1px, 0); } 50% { transform: translate(1px, 1px); } 100% { transform: translate(-1px, -1px); } }
#cam.hurt #camFlash { animation: flash .45s ease-out; }
#cam.hurt #camFrame { animation: shake .45s cubic-bezier(.36, .07, .19, .97); }
.chroma { position: absolute; z-index: 4; width: 7px; height: 7px; border-radius: 2px; background: var(--gold); box-shadow: 0 0 8px var(--gold); bottom: 60px; animation: chroma 1.1s ease-out forwards; pointer-events: none; }
@keyframes chroma { to { transform: translate(var(--dx), -360px) rotate(300deg); opacity: 0; } }
@keyframes flash { 0% { opacity: .95; } 100% { opacity: 0; } }
@keyframes shake { 10%, 90% { transform: translate(-3px, 1px) rotate(-.6deg); } 20%, 80% { transform: translate(6px, -2px) rotate(.8deg); } 30%, 50%, 70% { transform: translate(-9px, 3px) rotate(-1deg); } 40%, 60% { transform: translate(9px, -1px) rotate(1deg); } }

#camTag { position: absolute; left: 14px; top: 12px; z-index: 5; display: flex; align-items: center; gap: 8px; font-family: var(--display); font-weight: 700; font-size: 15px; letter-spacing: .08em; }
#camTag .live { background: var(--red); color: #fff; padding: 3px 9px; border-radius: 6px; display: flex; align-items: center; gap: 6px; }
#camTag .live i { width: 8px; height: 8px; border-radius: 50%; background: #fff; animation: pulse 1.2s infinite; }
#camTag .ki { background: rgba(0, 0, 0, .55); padding: 3px 9px; border-radius: 6px; color: var(--cyan); border: 1px solid rgba(70, 224, 255, .4); }
@keyframes pulse { 50% { opacity: .25; } }
#camMood { position: absolute; left: 50%; bottom: 104px; z-index: 5; transform: translateX(-50%) scale(.6); opacity: 0; white-space: nowrap; font: 700 19px var(--display); letter-spacing: .06em; padding: 4px 14px; border-radius: 99px; background: rgba(0, 0, 0, .7); border: 2px solid var(--edge, #fff); color: #fff; transition: opacity .2s, transform .25s cubic-bezier(.2, 1.6, .4, 1); }
#camMood.on { opacity: 1; transform: translateX(-50%) scale(1); }
#camBar { position: absolute; left: 0; right: 0; bottom: 0; z-index: 5; padding: 30px 14px 12px; background: linear-gradient(transparent, rgba(4, 8, 16, .94) 45%); display: flex; flex-direction: column; gap: 7px; }
#camName { font-family: var(--display); font-weight: 700; font-size: 22px; letter-spacing: .03em; text-shadow: 0 2px 6px #000; display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
#camAct { font-family: var(--body); font-size: 13.5px; font-weight: 700; color: var(--lime); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#hp { display: flex; gap: 3px; }
#hp b { flex: 1; height: 10px; border-radius: 3px; background: rgba(255, 255, 255, .14); overflow: hidden; }
#hp b i { display: block; height: 100%; background: linear-gradient(180deg, #ff7b88, #e8203a); transition: width .25s; }
#rage { display: grid; grid-template-columns: auto 1fr; align-items: center; gap: 8px; font: 700 12px var(--display); letter-spacing: .12em; color: #ffb199; }
#rage div { height: 10px; border-radius: 99px; background: rgba(255, 255, 255, .12); overflow: hidden; }
#rage i { display: block; height: 100%; width: 0; border-radius: 99px; background: linear-gradient(90deg, #ffd257, #ff7a2f 55%, #ff2b3f); box-shadow: 0 0 10px rgba(255, 90, 40, .8); }
#rage.max { color: #fff; animation: pulse .4s infinite; }
#meter { position: absolute; right: 14px; top: 10px; z-index: 5; display: flex; gap: 3px; align-items: flex-end; height: 34px; }
#meter i { width: 4px; border-radius: 2px; background: var(--lime); height: 4px; opacity: .85; }

/* ---------- Untertitel ---------- */
#subs { width: 760px; min-height: 112px; display: flex; align-items: flex-start; }
#stage.f916 #subs { width: 640px; min-height: 190px; align-items: flex-end; justify-content: flex-end; }
#stage.f916 #subBox { font-size: 31px; border-radius: 22px 22px 6px 22px; border-width: 2px; }
#subBox { background: var(--glass); border: 1px solid var(--glass-edge); border-radius: 16px; padding: 14px 20px; font-size: 30px; line-height: 1.28; font-weight: 800; letter-spacing: .005em; text-shadow: 0 2px 4px rgba(0, 0, 0, .9); backdrop-filter: blur(8px); opacity: 0; transform: translateY(8px); transition: opacity .18s, transform .18s; max-width: 100%; }
#subBox.on { opacity: 1; transform: none; }
#subBox .w { color: rgba(244, 247, 251, .34); transition: color .08s; }
#subBox .w.said { color: var(--ink); }
#subBox .w.now { color: var(--gold); }
#subBox.panic .w.now { color: var(--red); }
#subBox.hype .w.now { color: var(--lime); }

/* ---------- Gift-Legende (Karussell: 4 Gifts pro Seite, wechselt animiert) ---------- */
#legend { width: 300px; background: var(--glass); border: 1px solid var(--glass-edge); border-radius: 22px; padding: 12px 12px 12px; backdrop-filter: blur(10px); box-shadow: 0 10px 40px rgba(0, 0, 0, .45); }
#lgHead { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 0 4px; }
#lgTitle { font-family: var(--display); font-size: 16px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--cyan); white-space: nowrap; }
#lgTitle b { color: var(--gold); }
#legend:not(.strip) #lgTitle b { display: none; }
#legend:not(.strip) #lgTitle { font-size: 15px; }
#lgDots { display: flex; gap: 6px; }
#lgDots i { width: 9px; height: 9px; border-radius: 50%; background: rgba(255, 255, 255, .22); transition: background .3s, width .3s; }
#lgDots i.on { background: var(--gold); width: 24px; border-radius: 99px; }
#lgBar { height: 3px; border-radius: 99px; background: rgba(255, 255, 255, .1); margin: 9px 2px 8px; overflow: hidden; }
#lgBar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--cyan), var(--gold)); }
#lgBar i.run { animation: lgBar var(--page, 7s) linear forwards; }
@keyframes lgBar { to { width: 100%; } }
#legendList { display: grid; grid-template-columns: 1fr; grid-auto-rows: 76px; gap: 6px; height: 322px; perspective: 900px; }
.gift { position: relative; display: grid; grid-template-columns: 62px 1fr; align-items: center; gap: 10px; padding: 6px 8px; border-radius: 14px; background: rgba(4, 8, 16, .5); border: 1px solid rgba(255, 255, 255, .09); min-width: 0; --fx: var(--red); }
.gift.support { --fx: var(--lime); } .gift.boss { --fx: var(--violet); }
.gift.in { animation: gIn .55s cubic-bezier(.2, 1.4, .4, 1) both; animation-delay: calc(var(--i) * 90ms); }
.gift.out { animation: gOut .32s ease-in both; animation-delay: calc(var(--i) * 55ms); }
@keyframes gIn { 0% { opacity: 0; transform: translateY(-34px) rotateX(-80deg) scale(.7); } 100% { opacity: 1; transform: none; } }
@keyframes gOut { 100% { opacity: 0; transform: translateY(30px) rotateX(75deg) scale(.8); } }
.gift.hit { animation: gHit .9s ease-out; border-color: var(--gold); box-shadow: 0 0 26px rgba(255, 210, 87, .75); }
@keyframes gHit { 0% { transform: scale(1); } 18% { transform: scale(1.12) rotate(-2deg); } 36% { transform: scale(.97) rotate(1.5deg); } 100% { transform: scale(1); } }
.gift.changed { animation: gChanged 1.4s ease-out; }
@keyframes gChanged { 0%, 40% { box-shadow: 0 0 0 3px var(--cyan), 0 0 30px rgba(70, 224, 255, .8); transform: scale(1.06); } 100% { box-shadow: none; transform: none; } }
.g3d { width: 62px; height: 62px; perspective: 260px; }
.g3d .disc { width: 100%; height: 100%; border-radius: 50%; display: grid; place-items: center; font-size: 34px; background: radial-gradient(circle at 32% 26%, rgba(255, 255, 255, .42), rgba(120, 190, 255, .14) 46%, rgba(10, 16, 28, .55)); border: 1px solid rgba(255, 255, 255, .24); box-shadow: 0 8px 14px rgba(0, 0, 0, .45), inset 0 -6px 10px rgba(0, 0, 0, .35); animation: float3d 4.2s ease-in-out infinite; animation-delay: calc(var(--i) * -1.1s); transform-style: preserve-3d; }
.g3d img { width: 78%; height: 78%; object-fit: contain; filter: drop-shadow(0 3px 4px rgba(0, 0, 0, .6)); }
@keyframes float3d { 0%, 100% { transform: translateY(2px) rotateY(-20deg) rotateX(6deg); } 50% { transform: translateY(-5px) rotateY(20deg) rotateX(-4deg); } }
.gtxt { min-width: 0; }
.gname { font-weight: 800; font-size: 17px; display: flex; align-items: center; gap: 8px; min-width: 0; }
.gname span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.coin { flex: none; font-family: var(--display); font-size: 13px; font-weight: 700; color: #3b2a00; background: linear-gradient(180deg, #ffe58a, #f0b21a); border-radius: 20px; padding: 1px 8px 1px 6px; display: inline-flex; align-items: center; gap: 4px; }
.coin::before { content: ''; width: 9px; height: 9px; border-radius: 50%; background: #fff3c0; border: 2px solid #b97d00; }
.gfx { font-size: 15px; font-weight: 800; color: var(--fx); margin-top: 3px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.gfx::before { content: '➜ '; color: var(--ink-dim); }
/* Hochformat: breite Leiste mit vier großen Karten nebeneinander */
#legend.strip { width: 1020px; padding: 14px 16px 16px; border-radius: 28px; border-width: 2px; }
#legend.strip #lgTitle { font-size: 25px; }
#legend.strip #lgDots i { width: 12px; height: 12px; } #legend.strip #lgDots i.on { width: 34px; }
#legend.strip #lgBar { height: 5px; margin: 12px 2px 14px; }
#legend.strip #legendList { grid-template-columns: repeat(4, 1fr); grid-auto-rows: 262px; gap: 12px; height: 262px; }
#legend.strip .gift { grid-template-columns: 1fr; grid-template-rows: 122px auto; justify-items: center; align-content: start; gap: 6px; padding: 12px 8px 0; border-radius: 20px; overflow: hidden; border-width: 2px; border-color: color-mix(in srgb, var(--fx) 45%, transparent); background: linear-gradient(180deg, rgba(10, 16, 30, .82), rgba(4, 8, 16, .9)); }
#legend.strip .g3d { width: 118px; height: 118px; }
#legend.strip .g3d .disc { font-size: 68px; }
#legend.strip .gtxt { width: 100%; text-align: center; display: grid; gap: 4px; }
#legend.strip .gname { flex-direction: column; gap: 4px; font-size: 23px; line-height: 1.1; }
#legend.strip .gname span:first-child { max-width: 100%; }
#legend.strip .coin { font-size: 19px; padding: 2px 12px 2px 8px; }
#legend.strip .coin::before { width: 13px; height: 13px; }
#legend.strip .gfx { position: absolute; left: 0; right: 0; bottom: 0; margin: 0; padding: 8px 6px 9px; font-size: 21px; color: #0a0e14; background: var(--fx); text-align: center; letter-spacing: .01em; }
#legend.strip .gfx::before { content: ''; }
#legend.strip .gfx.long { font-size: 17px; padding-block: 11px; }
#legend.strip .gift.support .gfx::before { content: '💚 '; } #legend.strip .gift.boss .gfx::before { content: '☠️ '; }

/* ---------- Gift-Alert ---------- */
#alerts { width: 760px; height: 210px; pointer-events: none; display: flex; flex-direction: column; align-items: center; gap: 14px; }
#stage.f916 #alerts { width: 680px; align-items: flex-start; }
/* ---------- Bot-Status-HUD ---------- */
#hud { width: 330px; background: var(--glass); border: 1px solid var(--glass-edge); border-radius: 16px; padding: 12px 14px; backdrop-filter: blur(10px); display: grid; gap: 8px; }
#hudGoal { font: 700 19px var(--display); letter-spacing: .02em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#hudRow { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; font-variant-numeric: tabular-nums; }
#hudRow div { background: rgba(0, 0, 0, .35); border-radius: 8px; padding: 4px 6px; text-align: center; }
#hudRow b { display: block; font: 700 18px var(--display); }
#hudRow span { font-size: 11px; color: var(--ink-dim); font-weight: 600; }
#hudCam { font-size: 13px; font-weight: 700; color: var(--cyan); display: flex; justify-content: space-between; gap: 8px; }
#hudCam em { font-style: normal; color: var(--gold); }
.alert { position: relative; display: flex; align-items: center; height: 96px; white-space: nowrap; animation: alertIn .55s cubic-bezier(.2, 1.35, .35, 1) both; --a1: #ff2d74; --a2: #ff8a3d; }
.alert.support { --a1: #19c37d; --a2: #b6f24a; }
.alert.boss { --a1: #7b3dff; --a2: #ff3dd4; }
.alert.out { animation: alertOut .4s ease-in forwards; }
.alert .pill { display: flex; align-items: center; gap: 14px; height: 96px; padding: 0 86px 0 8px; border-radius: 99px; background: linear-gradient(90deg, var(--a1), var(--a2) 62%, rgba(0, 0, 0, 0)); box-shadow: 0 10px 30px rgba(0, 0, 0, .45), inset 0 0 0 2px rgba(255, 255, 255, .22); }
.alert .pill::after { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 420px; border-radius: 99px; background: linear-gradient(100deg, transparent 30%, rgba(255, 255, 255, .5) 50%, transparent 70%); background-size: 250% 100%; animation: shine 1.1s ease-out .25s both; pointer-events: none; mix-blend-mode: soft-light; }
@keyframes shine { from { background-position: 120% 0; } to { background-position: -60% 0; } }

<body>

<script src="vendor/skinview3d.bundle.js"></script>
<script>
'use strict'
/* ============================================================================
 * Studio-Overlay – EINE transparente 1920x1080-Seite für OBS / TikTok Live Studio.
 * Audio: ausschließlich die vom Backend gerenderte männliche Neural-Stimme (WebSocket-Puffer).
 * Es gibt bewusst KEINEN Browser-Sprachausgabe-Fallback.
 * ========================================================================== */
const DEMO = /(^|[?&#])demo\b/.test(location.search + location.hash)
const $ = id => document.getElementById(id)
const stage = $('stage')
const WIDGETS = [...document.querySelectorAll('.wg')]
const FORMATS = { '16:9': [1920, 1080], '9:16': [1080, 1920], custom: [1920, 1080] }
const DEFAULTS = {
  '16:9': { likes: { x: 680, y: 960, s: 1 }, alerts: { x: 580, y: 34, s: 1 }, hud: { x: 36, y: 36, s: 1 }, legend: { x: 1584, y: 250, s: 1 }, cam: { x: 36, y: 460, s: 1 }, subs: { x: 36, y: 932, s: 1 } },
  // 9:16 (TikTok LIVE): oben 230 px frei für Profil/Zuschauerzahl, unten links frei für den Chat,
  // ganz unten frei für die Bedienleiste. Gift-Leiste oben, Facecam rechts über dem Herz-Knopf.
  '9:16': { legend: { x: 30, y: 236, s: 1 }, likes: { x: 30, y: 608, s: 1 }, alerts: { x: 30, y: 740, s: 1 }, hud: { x: 746, y: 744, s: 0.92 }, subs: { x: 30, y: 1030, s: 1 }, cam: { x: 690, y: 1040, s: 1 } },
  // Split: linke Spalte Streamer, rechte Spalte Gifts, Mitte komplett frei
  custom: { likes: { x: 680, y: 30, s: 1 }, alerts: { x: 580, y: 880, s: 0.9 }, hud: { x: 36, y: 30, s: 1 }, legend: { x: 1580, y: 30, s: 1.05 }, cam: { x: 36, y: 180, s: 1.1 }, subs: { x: 36, y: 700, s: 0.78 } }
}
const QS = new URLSearchParams(location.search)
const MUTE = QS.has('mute') // eingebettete Vorschau im Dashboard: kein Ton
const FORCE_FORMAT = QS.get('format')
let layout = { format: '9:16', formats: {} }
let fitScale = 1
function fit () {
  const [W, H] = FORMATS[layout.format]
  stage.style.width = W + 'px'; stage.style.height = H + 'px'
  const top = document.body.classList.contains('designer') ? $('dz').offsetHeight + 24 : 0
  fitScale = Math.min(innerWidth / W, (innerHeight - top) / H)
  stage.style.transform = `scale(${fitScale})`; stage.style.left = (innerWidth - W * fitScale) / 2 + 'px'; stage.style.top = top + (innerHeight - top - H * fitScale) / 2 + 'px'
}
const spec = id => ({ ...DEFAULTS[layout.format][id], ...((layout.formats[layout.format] || {})[id] || {}) })
function applyLayout () {
  for (const el of WIDGETS) {
    const w = spec(el.dataset.w)
    el.style.left = w.x + 'px'; el.style.top = w.y + 'px'; el.style.transform = `scale(${w.s})`
    el.classList.toggle('off', !!w.h)
  }
  for (const [id, f] of [['dz169', '16:9'], ['dz916', '9:16'], ['dzCustom', 'custom']]) $(id).classList.toggle('on', layout.format === f)
  stage.classList.toggle('f916', layout.format === '9:16')
  const strip = layout.format === '9:16'
  if ($('legend').classList.contains('strip') !== strip) { $('legend').classList.toggle('strip', strip); if (typeof showPage === 'function') showPage(lg.page, false) }
  fit(); syncSel()
}
function setLayout (l) {
  layout = l && l.formats ? { format: FORMATS[l.format] ? l.format : '9:16', formats: l.formats } : { format: '9:16', formats: {} }
  if (FORMATS[FORCE_FORMAT]) layout.format = FORCE_FORMAT
  applyLayout()
}
let saveT = null
function saveLayout () {
  clearTimeout(saveT)
  saveT = setTimeout(() => {
    try { localStorage.setItem('overlayLayout', JSON.stringify(layout)) } catch (_) {}
    if (ws && ws.readyState === 1) ws.send(JSON.stringify({ type: 'LAYOUT_SET', layout }))
    try { parent !== window && parent.postMessage({ type: 'overlay-layout', format: layout.format }, '*') } catch (_) {}
  }, 180)
}
function patch (id, p) {
  const f = layout.formats[layout.format] = layout.formats[layout.format] || {}
  f[id] = { ...spec(id), ...p }
  applyLayout(); saveLayout()
}

/* ---------------------------------------------------------------- Designer-Modus (F2 · ?designer=true · Dashboard) */
let selected = null; let snap = true
function setDesigner (on) {
  document.body.classList.toggle('designer', !!on)
  document.body.classList.toggle('grid', !!on && snap)
  if (!on) select(null)
  try { parent !== window && parent.postMessage({ type: 'overlay-designer', on: !!on }, '*') } catch (_) {}
  fit()
}
function select (el) { selected = el; for (const w of WIDGETS) w.classList.toggle('sel', w === el); syncSel() }
function syncSel () {
  if (!selected) { $('dzSel').textContent = 'Widget anklicken'; return }
  const w = spec(selected.dataset.w)
  $('dzSel').textContent = selected.dataset.name
  $('dzScale').value = Math.round(w.s * 100); $('dzPct').textContent = Math.round(w.s * 100) + '%'
  $('dzEye').textContent = w.h ? '🚫 Versteckt' : '👁️ Sichtbar'
}
for (const el of WIDGETS) {
  const tag = document.createElement('div'); tag.className = 'wgTag'; tag.textContent = el.dataset.name
  const grip = document.createElement('div'); grip.className = 'wgGrip'; grip.title = 'Ziehen zum Skalieren'
  el.append(tag, grip)
  el.addEventListener('pointerdown', e => {
    if (!document.body.classList.contains('designer')) return
    e.preventDefault(); select(el)
    const id = el.dataset.w; const start = spec(id); const sx = e.clientX; const sy = e.clientY
    const scaling = e.target === grip
    const baseW = el.offsetWidth || 1
    el.setPointerCapture(e.pointerId)
    const move = ev => {
      const dx = (ev.clientX - sx) / fitScale; const dy = (ev.clientY - sy) / fitScale
      const g = v => (snap && !ev.altKey ? Math.round(v / 20) * 20 : Math.round(v))
      if (scaling) patch(id, { s: Math.max(0.5, Math.min(2, Math.round((start.s + Math.max(dx, dy) / baseW) * 20) / 20)) })
      else patch(id, { x: g(start.x + dx), y: g(start.y + dy) })
    }
    const up = () => { el.removeEventListener('pointermove', move); el.removeEventListener('pointerup', up); el.removeEventListener('pointercancel', up) }
    el.addEventListener('pointermove', move); el.addEventListener('pointerup', up); el.addEventListener('pointercancel', up)
  })
}
$('dzScale').oninput = e => { if (selected) patch(selected.dataset.w, { s: Number(e.target.value) / 100 }) }
$('dzEye').onclick = () => { if (selected) patch(selected.dataset.w, { h: !spec(selected.dataset.w).h }) }
$('dzGrid').onclick = () => { snap = !snap; $('dzGrid').classList.toggle('on', snap); document.body.classList.toggle('grid', snap) }
$('dzReset').onclick = () => { layout.formats[layout.format] = {}; applyLayout(); saveLayout() }
$('dzDone').onclick = () => setDesigner(false)
const setFormat = f => { if (FORMATS[f]) { layout.format = f; applyLayout(); saveLayout() } }
$('dz169').onclick = () => setFormat('16:9'); $('dz916').onclick = () => setFormat('9:16'); $('dzCustom').onclick = () => setFormat('custom')
addEventListener('keydown', e => { if (e.key === 'F2') { e.preventDefault(); setDesigner(!document.body.classList.contains('designer')) } })
// Einbettende Seite (Dashboard/Vorschau) kann Designer und Format per postMessage schalten
addEventListener('message', e => { const m = e.data || {}; if (m.type === 'designer') setDesigner(m.on); else if (m.type === 'format') setFormat(m.format) })
addEventListener('resize', fit)
try { const saved = JSON.parse(localStorage.getItem('overlayLayout')); if (saved) layout = { format: FORMATS[saved.format] ? saved.format : '9:16', formats: saved.formats || {} } } catch (_) {}
if (FORMATS[FORCE_FORMAT]) layout.format = FORCE_FORMAT

/* ---------------------------------------------------------------- Skin (prozedural, 64x64) */
const FACE = { x: 8, y: 8 }
function drawSkin () {
  const c = document.createElement('canvas'); c.width = 64; c.height = 64
  const g = c.getContext('2d')
  const R = (x, y, w, h, col) => { g.fillStyle = col; g.fillRect(x, y, w, h) }
  const skin = '#e8b48c'; const skinD = '#cf9a74'; const hair = '#2b1d14'; const hood = '#19c2ff'; const hoodD = '#0f8fc4'; const pants = '#1c2333'; const shoe = '#f2f5f9'
  // Kopf
  R(0, 8, 32, 8, skin); R(8, 0, 8, 8, hair); R(16, 0, 8, 8, skinD)
  R(0, 8, 8, 3, hair); R(16, 8, 8, 3, hair); R(24, 8, 8, 8, hair) // Seiten + Hinterkopf
  R(8, 8, 8, 2, hair); R(8, 10, 1, 1, hair); R(15, 10, 1, 1, hair) // Pony
  R(9, 11, 2, 1, '#3a2a1e'); R(13, 11, 2, 1, '#3a2a1e') // Augenbrauen
  R(9, 12, 2, 1, '#fff'); R(13, 12, 2, 1, '#fff'); R(10, 12, 1, 1, '#1d6bff'); R(13, 12, 1, 1, '#1d6bff') // Augen
  R(11, 13, 2, 1, skinD) // Nase
  // Körper (Hoodie)
  R(16, 16, 24, 16, hood); R(20, 20, 8, 12, hood); R(23, 20, 2, 5, hoodD); R(21, 27, 6, 3, hoodD)
  R(22, 22, 1, 1, '#fff'); R(25, 22, 1, 1, '#fff') // Kordeln
  R(32, 20, 8, 12, hoodD)
  // Arme
  R(40, 16, 16, 16, hood); R(40, 29, 16, 3, skin); R(32, 48, 16, 16, hood); R(32, 61, 16, 3, skin)
  // Beine
  R(0, 16, 16, 16, pants); R(0, 29, 16, 3, shoe); R(16, 48, 16, 16, pants); R(16, 61, 16, 3, shoe)
  // Headset (zweite Kopfschicht)
  R(40, 3, 8, 2, '#10151f'); R(32, 10, 8, 4, '#10151f'); R(34, 11, 4, 2, '#46e0ff'); R(48, 10, 8, 4, '#10151f'); R(50, 11, 4, 2, '#46e0ff')
  R(40, 14, 1, 1, '#10151f'); R(41, 15, 2, 1, '#10151f') // Mikrofon-Arm
  return c
}

let viewer = null; let rig = null; let faceBase = null; let lastMouth = -1; let lastBlink = false
function initCam () {
  if (!window.skinview3d) return
  const canvas = $('skin')
  viewer = new skinview3d.SkinViewer({ canvas, width: 360, height: 452, pixelRatio: 2, skin: drawSkin() })
  viewer.animation = null
  viewer.controls.enableRotate = false; viewer.controls.enableZoom = false; viewer.controls.enablePan = false
  viewer.fov = 30
  viewer.camera.position.set(-9, 15, 74)
  viewer.controls.target.set(0, 10.5, 0)
  viewer.controls.update()
  viewer.globalLight.intensity = 2.6
  viewer.cameraLight.intensity = 1.1
  rig = viewer.playerObject.skin
  const tryCustom = new Image()
  tryCustom.onload = () => { if (tryCustom.width >= 64) { viewer.loadSkin(tryCustom); setTimeout(grabFace, 60) } }
  tryCustom.src = 'skin.png' // optional: eigener Skin in /public/skin.png

  if (to === from && to < speech.words.length) to++

/* ---------------------------------------------------------------- Stimmung (Wut, Freude, Angst, Trauer) */

  el.style.setProperty('--dx', (Math.random() * 90 - 45) + 'px'); el.style.setProperty('--r0', (Math.random() * 40 - 20) + 'deg'); el.style.setProperty('--r1', (Math.random() * 80 - 40) + 'deg'); el.style.setProperty('--d', (1 + Math.random() * 0.7) + 's')

const PER_PAGE = 4; const PAGE_MS = 7000

function giftCard (g, i, cls) {

function drawDots () {

}
function armTimer () {
  clearTimeout(lg.timer)
  const bar = $('lgBar').firstElementChild
  bar.classList.remove('run'); bar.style.width = '0'
  if (lg.pages < 2) return
  void bar.offsetWidth; bar.style.setProperty('--page', PAGE_MS + 'ms'); bar.classList.add('run')
  lg.timer = setTimeout(() => showPage((lg.page + 1) % lg.pages, true), PAGE_MS)
}
/** Seite anzeigen. animate: alte Karten klappen weg, neue klappen nacheinander herein. */
function showPage (i, animate = true, changed = null) {
  lg.pages = Math.max(1, Math.ceil(giftCfg.length / PER_PAGE))
  lg.page = ((i % lg.pages) + lg.pages) % lg.pages
  const root = $('legendList')
  const items = giftCfg.slice(lg.page * PER_PAGE, lg.page * PER_PAGE + PER_PAGE)
  const fill = () => { root.textContent = ''; items.forEach((g, n) => root.appendChild(giftCard(g, n, animate ? 'in' : (changed && changed.has(g.id) ? 'changed' : '')))); lg.busy = false }
  drawDots(); armTimer()
  if (animate && root.childElementCount) {
    lg.busy = true
    ;[...root.children].forEach(c => { c.classList.remove('in', 'hit', 'changed'); c.classList.add('out') })
    setTimeout(fill, 320 + root.childElementCount * 55)
  } else fill()
}
/** Neue Konfiguration vom Dashboard: Seite bleibt stehen, geänderte Karten blinken kurz auf. */
function renderLegend (list) {
  const old = new Map(giftCfg.map(g => [g.id, giftSig(g)]))
  const first = !giftCfg.length
  giftCfg = (list || []).slice(0, 24)
  const changed = new Set(giftCfg.filter(g => old.get(g.id) !== giftSig(g)).map(g => g.id))
  if (first) return showPage(0, true)
  // Wurde genau ein Gift geändert, springt das Karussell auf dessen Seite, damit man die Änderung sofort sieht
  let page = lg.page
  if (changed.size && changed.size <= 2) { const idx = giftCfg.findIndex(g => changed.has(g.id)); if (idx >= 0) page = Math.floor(idx / PER_PAGE) }
  showPage(page, page !== lg.page, changed)
}
/** Kommt ein Gift an, springt das Karussell auf dessen Seite und die Karte leuchtet auf. */
function hitLegend (name) {
  const idx = giftCfg.findIndex(g => g.name === name)
  if (idx < 0) return
  const page = Math.floor(idx / PER_PAGE)
  const flash = () => { const row = [...document.querySelectorAll('#legendList .gift')].find(r => r.dataset.id === giftCfg[idx].id); if (row) { row.classList.remove('in', 'hit'); void row.offsetWidth; row.classList.add('hit'); setTimeout(() => row.classList.remove('hit'), 950) } }
  if (page !== lg.page) { showPage(page, true); setTimeout(flash, 900) } else { flash(); armTimer() }
}

/* ---------------------------------------------------------------- Gift-Alerts im TikTok-Stil (zwei Bahnen) + Combo */
const alertsEl = $('alerts')
const LANES = 2
const activeAlerts = []; const alertQueue = []
function chime (tier) {
  if (!audio() || actx.state !== 'running') return
  const t0 = actx.currentTime
  const notes = tier >= 5 ? [196, 147, 110, 82] : tier >= 3 ? [523, 659, 784, 1047] : [784, 1047]
  notes.forEach((f, i) => {
    const o = actx.createOscillator(); const g = actx.createGain()
    o.type = tier >= 5 ? 'sawtooth' : 'triangle'; o.frequency.value = f
    g.gain.setValueAtTime(0, t0 + i * 0.09); g.gain.linearRampToValueAtTime(0.16, t0 + i * 0.09 + 0.02); g.gain.exponentialRampToValueAtTime(0.001, t0 + i * 0.09 + (tier >= 5 ? 0.6 : 0.3))
    o.connect(g); g.connect(actx.destination); o.start(t0 + i * 0.09); o.stop(t0 + i * 0.09 + 0.7)
  })
}
const pic = (box, icon, emoji) => { if (icon) { const im = new Image(); im.referrerPolicy = 'no-referrer'; im.alt = ''; im.onerror = () => { im.remove(); box.textContent = emoji || '🎁' }; im.src = icon; box.appendChild(im) } else box.textContent = emoji || '🎁' }
function giftAlert (a) {
  const key = a.uniqueId + '|' + a.gift.name
  hitLegend(a.gift.name)
  // Stimmung: Monster-Gifts machen ihn sauer, Support macht ihn glücklich
  if (a.kind === 'support') { feel('joy', 0.6); feel('rage', -0.25); anim.cheer = performance.now() + 1500 } else if (a.kind !== 'none') { feel('rage', 0.14 + (a.tier || 1) * 0.07); if (a.tier >= 4) feel('fear', 0.5) }
  const live = activeAlerts.find(x => x.key === key)

  const q = alertQueue.find(x => x.key === key)

  alertQueue.push({ ...a, key })

}
function setCombo (al) {

function sparks (el, n) {

function showAlert (a) {

  el.className = 'alert' + (a.kind === 'support' ? ' support' : a.tier >= 5 ? ' boss' : '')

function onMessage (m) {
  switch (m.type) {
    case 'GIFT_CONFIG_SYNC': renderLegend(m.gifts); break
    case 'GIFT_ALERT': giftAlert(m); break
    case 'LIKES': setLikes(m); break
    case 'LIKE_GOAL': likeGoal(m); break
    case 'TTS': playTTS(m); break
    case 'STATUS': setStatus(m.status); break

}

let ws = null; let retry = 600
function connect () {
  try { ws = new WebSocket(`${location.protocol === 'https:' ? 'wss' : 'ws'}://${location.host}/ws?role=overlay`) } catch (_) { return setTimeout(connect, 2000) }
  ws.onopen = () => { retry = 600 }
  ws.onmessage = e => { try { onMessage(JSON.parse(e.data)) } catch (_) {} }
  ws.onclose = () => { setTimeout(connect, retry); retry = Math.min(5000, retry * 1.6) }
  ws.onerror = () => { try { ws.close() } catch (_) {} }
}

    [33500, () => { status({ health: 0, fighting: false, threats: 0 }); onMessage({ type: 'BOT_EVENT', event: 'death' }); say('Nein... das war es. Mein ganzes Inventar. Tom, das verzeih ich dir nie!', 'panic') }],
    [40500, () => { status({ activity: 'explore', health: 20, goal: 'Loot zurückholen' }); onMessage({ type: 'BOT_EVENT', event: 'respawn' }); say('Okay. Tief durchatmen. Ich hol mir jetzt alles zurück.') }],
    [46000, () => { status({ activity: 'mine', goal: 'Diamanten suchen', health: 14, pos: { x: 118, y: -54, z: -37 } }); onMessage({ type: 'GIFT_CONFIG_SYNC', gifts: gifts.map(g => g.id === 'rose' ? { ...g, legend: 'Creeper' } : g) }) }],
    [52000, () => { onMessage({ type: 'GIFT_CONFIG_SYNC', gifts }) }],
    [54000, () => {}]
  ]
  let timers = []
  const run = () => { timers.forEach(clearTimeout); timers = script.map(([t, fn]) => setTimeout(fn, t)); timers.push(setTimeout(run, script[script.length - 1][0])) }
  run()
}

initCam()
applyLayout()
if (QS.get('solo')) { const el = WIDGETS.find(w => w.dataset.w === QS.get('solo')); if (el) { for (const w of WIDGETS) w.classList.toggle('off', w !== el); el.style.left = '10px'; el.style.top = '10px'; el.style.transform = 'none'; stage.style.transform = 'none'; stage.style.left = stage.style.top = '0' } }
if (QS.get('mood')) setInterval(() => { const m = QS.get('mood'); if (m === 'sleep') bot.sleeping = true; else if (m === 'furious') mood.rage = 1; else if (m === 'angry') mood.rage = 0.7; else if (m === 'scared') mood.fear = 1; else if (m === 'sad') mood.sad = 1; else if (m === 'happy') mood.joy = 1 }, 100)
requestAnimationFrame(frame)
if (/[?&]designer=(true|1)/.test(location.search) || /designer/.test(location.hash)) setDesigner(true)
if (DEMO) demo(); else connect()
</script>
