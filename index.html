<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ElegantEvent Manager</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        @keyframes bounceIn { 0% { transform: scale(0.9); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
        @keyframes fadeIn { 0% { opacity: 0; } 100% { opacity: 1; } }
        .animate-bounce-in { animation: bounceIn 0.3s cubic-bezier(0.18, 0.89, 0.32, 1.28) forwards; }
        .animate-fade-in { animation: fadeIn 0.4s ease-out forwards; }
        .pb-safe { padding-bottom: env(safe-area-inset-bottom); }
        body { -webkit-tap-highlight-color: transparent; }
    </style>
</head>
<body class="bg-slate-50">
    <div id="root"></div>

    <script type="text/babel" data-type="module">
        import React, { useState, useEffect, useMemo, useRef } from 'https://esm.sh/react@18.2.0';
        import ReactDOM from 'https://esm.sh/react-dom@18.2.0/client';
        import { 
            LayoutDashboard, List, PlusCircle, MapPin, Calendar, DollarSign, Trash2,
            TrendingUp, Clock, CheckCircle, AlertCircle, CheckSquare, UserCheck,
            Archive, History, PieChart, Phone, Navigation, BarChart3, UserCircle,
            LogOut, Lock, UserPlus, LogIn, Loader2, CloudOff, Sparkles, Cloud, Bell
        } from 'https://esm.sh/lucide-react@0.292.0';

        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { 
            getFirestore, collection, addDoc, onSnapshot, 
            query, orderBy, doc, deleteDoc, updateDoc, serverTimestamp 
        } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // --- FIREBASE CONFIG ---
        const firebaseConfig = {
            apiKey: "AIzaSyAugljddmPLH4QAKy2X2AaiOG4qp9IQg8c",
            authDomain: "elegantevent-27d55.firebaseapp.com",
            projectId: "elegantevent-27d55",
            storageBucket: "elegantevent-27d55.firebasestorage.app",
            messagingSenderId: "13045694360",
            appId: "1:13045694360:web:b05d85ed441e9895c3f5ed",
            measurementId: "G-V9JERJCHXR"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const COL_NAME = "auftraege";

        const MASCOTS = ["Chase (Paw Patrol)", "Marshall (Paw Patrol)", "Skye (Paw Patrol)", "Sonic", "Stitch", "Micky Maus", "Minnie Maus", "Mario", "Luigi", "Mascha", "Der Bär", "Spiderman"];
        const TEAM_CODE = "maskottchen"; 
        const SEMIH_CODE = "Semih2005"; 
        const apiKey = ""; 

        const formatCurrency = (amount) => new Intl.NumberFormat('de-DE', { style: 'currency', currency: 'EUR' }).format(amount);
        const formatDate = (dateString) => {
            if (!dateString) return 'Ungültiges Datum';
            const options = { weekday: 'short', year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' };
            return new Date(dateString).toLocaleDateString('de-DE', options);
        };
        const getMonthName = (dateString) => {
            if (!dateString) return '';
            return new Date(dateString).toLocaleDateString('de-DE', { month: 'long', year: 'numeric' });
        };

        // --- KOMPONENTEN ---
        const Toast = ({ message, type = 'success', onClose }) => {
            useEffect(() => { const timer = setTimeout(onClose, 3000); return () => clearTimeout(timer); }, [onClose]);
            return (
                <div className={`fixed top-24 right-5 px-6 py-4 rounded-xl shadow-2xl z-[100] flex items-center space-x-3 animate-bounce-in border ${type === 'success' ? 'bg-white border-green-500 text-green-700' : 'bg-white border-red-500 text-red-700'}`}>
                    {type === 'success' ? <CheckCircle size={24} /> : <AlertCircle size={24} />}
                    <span className="font-bold text-base">{message}</span>
                </div>
            );
        };

        const ConfirmModal = ({ isOpen, title, message, onConfirm, onCancel }) => {
            if (!isOpen) return null;
            return (
                <div className="fixed inset-0 z-[200] flex items-center justify-center bg-black/60 backdrop-blur-sm p-4 animate-fade-in">
                    <div className="bg-white rounded-2xl shadow-2xl w-full max-w-md overflow-hidden transform transition-all scale-100">
                        <div className="p-8">
                            <h3 className="text-2xl font-bold text-slate-800 mb-3">{title}</h3>
                            <p className="text-slate-600 text-lg leading-relaxed">{message}</p>
                        </div>
                        <div className="bg-slate-50 px-8 py-5 flex space-x-4 justify-end border-t border-slate-100">
                            <button onClick={onCancel} className="px-6 py-3 rounded-xl text-slate-600 font-bold hover:bg-slate-200 transition-colors">Abbrechen</button>
                            <button onClick={onConfirm} className="px-6 py-3 rounded-xl bg-red-600 text-white font-bold hover:bg-red-700 shadow-lg transition-colors">Löschen</button>
                        </div>
                    </div>
                </div>
            );
        };

        const BookingCard = ({ booking, onDeleteRequest, onToggleStatus }) => {
            const isCompleted = booking.status === 'completed';
            const isPastDate = new Date(booking.date) < new Date();
            const mascotList = Array.isArray(booking.mascot) ? booking.mascot : [booking.mascot];
            const cleanNumber = booking.contact ? booking.contact.replace(/[^0-9+]/g, '') : '';
            const phoneLink = cleanNumber.length > 3 ? `tel:${cleanNumber}` : null;

            return (
                <div className={`group rounded-2xl border border-slate-100 p-5 relative transition-all duration-300 hover:-translate-y-1 hover:shadow-xl bg-white ${isCompleted ? 'bg-slate-50/50' : ''}`}>
                    <div className={`absolute left-0 top-6 bottom-6 w-1 rounded-r-full ${isCompleted ? 'bg-green-500' : isPastDate ? 'bg-slate-300' : 'bg-indigo-500'}`}></div>
                    <div className="pl-3">
                        <div className="flex justify-between items-start mb-4">
                            <div className="flex flex-wrap gap-2">
                                {mascotList.map((m, idx) => (
                                    <span key={idx} className={`px-2.5 py-1 rounded-lg text-xs font-bold uppercase tracking-wider border ${isCompleted ? 'bg-green-100 text-green-700 border-green-200' : 'bg-indigo-50 text-indigo-700 border-indigo-100'}`}>{m}</span>
                                ))}
                                {booking.assignee && (
                                    <span className="flex items-center text-xs font-bold text-slate-600 bg-slate-100 px-3 py-1 rounded-lg border border-slate-200"><UserCheck size={14} className="mr-1.5" /> {booking.assignee}</span>
                                )}
                            </div>
                            <div className="flex space-x-1 opacity-100 md:opacity-0 md:group-hover:opacity-100 transition-opacity"> 
                                <button onClick={(e) => { e.stopPropagation(); onToggleStatus(booking.id, booking.status); }} className={`p-2 rounded-lg transition-colors ${isCompleted ? 'bg-green-100 text-green-600' : 'bg-slate-100 text-slate-400 hover:text-green-600 hover:bg-green-50'}`}>
                                    <CheckSquare size={18} />
                                </button>
                                <button onClick={(e) => { e.stopPropagation(); onDeleteRequest(booking.id); }} className="p-2 rounded-lg bg-red-50 text-red-400 hover:bg-red-100 hover:text-red-600 transition-colors">
                                    <Trash2 size={18} />
                                </button>
                            </div>
                        </div>
                        <div className="space-y-3 mb-4">
                            <h3 className={`text-lg font-bold flex items-center ${isCompleted ? 'text-green-800' : 'text-slate-800'}`}>
                                <Calendar size={18} className={`mr-2.5 ${isCompleted ? 'text-green-500' : 'text-indigo-500'}`} /> {formatDate(booking.date)}
                            </h3>
                            <div className="flex items-start">
                                <MapPin size={18} className={`mr-2.5 mt-1 shrink-0 ${isCompleted ? 'text-green-500' : 'text-red-500'}`} />
                                <a href={`https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(booking.location)}`} target="_blank" className="text-base text-slate-700 hover:text-indigo-600 hover:underline font-medium">{booking.location} <Navigation size={12} className="ml-1 inline-block text-indigo-400" /></a>
                            </div>
                            {booking.contact && (
                                <div className="flex items-center text-slate-600">
                                    <Phone size={18} className={`mr-2.5 ${isCompleted ? 'text-green-500' : 'text-indigo-500'}`} />
                                    {phoneLink ? <a href={phoneLink} onClick={(e) => e.stopPropagation()} className="text-base font-bold text-slate-700 hover:text-indigo-600 underline">{booking.contact}</a> : <span className="text-base font-medium text-slate-700">{booking.contact}</span>}
                                </div>
                            )}
                        </div>
                        <div className="pt-4 border-t border-slate-100 flex justify-between items-center">
                            <div className="text-sm text-slate-500 italic truncate max-w-[60%] flex items-center">
                                {booking.notes && booking.notes.includes("AI-Vorschlag") && <Sparkles size={12} className="mr-1 text-purple-500" />} {booking.notes || "Keine Notizen"}
                            </div>
                            <span className={`text-lg font-bold px-3 py-1 rounded-lg ${isCompleted ? 'bg-green-50 text-green-700' : 'bg-slate-50 text-slate-900'}`}>{formatCurrency(booking.revenue)}</span>
                        </div>
                    </div>
                </div>
            );
        };

        const HistoryRow = ({ month, revenue, count }) => (
            <div className="flex justify-between items-center bg-white p-4 rounded-xl border border-slate-100 hover:border-emerald-200 transition-all shadow-sm">
                <div className="flex items-center space-x-4">
                    <div className="bg-emerald-100 p-3 rounded-xl text-emerald-700"><History size={20} /></div>
                    <div><span className="block font-bold text-slate-800 text-lg">{month}</span><span className="text-sm text-slate-500">{count} Aufträge</span></div>
                </div>
                <p className="text-xl font-bold text-emerald-700 bg-emerald-50 px-4 py-2 rounded-lg">{formatCurrency(revenue)}</p>
            </div>
        );

        const DashboardView = ({ stats, onDeleteRequest, onToggleStatus }) => (
            <div className="space-y-8 animate-fade-in">
                <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div className="bg-white p-6 rounded-3xl border border-slate-100 shadow-sm flex flex-col relative overflow-hidden group hover:shadow-md transition-shadow">
                        <div className="absolute right-0 top-0 p-6 opacity-5 group-hover:opacity-10 transition-opacity"><Clock size={100}/></div>
                        <span className="text-sm font-bold uppercase tracking-wider text-slate-500 mb-2 flex items-center"><Clock size={16} className="mr-2 text-indigo-500"/> Offene Jobs</span>
                        <span className="text-5xl font-extrabold text-slate-800">{stats.openCount}</span>
                    </div>
                    <div className="bg-white p-6 rounded-3xl border border-slate-100 shadow-sm flex flex-col relative overflow-hidden group hover:shadow-md transition-shadow">
                        <div className="absolute right-0 top-0 p-6 opacity-5 group-hover:opacity-10 transition-opacity"><CheckCircle size={100}/></div>
                        <span className="text-sm font-bold uppercase tracking-wider text-slate-500 mb-2 flex items-center"><CheckCircle size={16} className="mr-2 text-emerald-500"/> Erledigt</span>
                        <span className="text-5xl font-extrabold text-slate-800">{stats.completedCount}</span>
                    </div>
                </div>
                <div>
                    <h2 className="text-2xl font-bold text-slate-800 flex items-center mb-6"><Clock className="mr-3 text-indigo-600" size={28}/> Nächste Termine</h2>
                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                        {stats.nextThree.length > 0 ? (
                            stats.nextThree.map(booking => <BookingCard key={booking.id} booking={booking} onDeleteRequest={onDeleteRequest} onToggleStatus={onToggleStatus} />)
                        ) : (
                            <div className="col-span-full p-12 text-center bg-slate-50 rounded-3xl border-2 border-dashed border-slate-200"><p className="text-slate-400 font-medium text-lg">Aktuell keine offenen Termine anstehend.</p></div>
                        )}
                    </div>
                </div>
            </div>
        );

        const FinancialView = ({ stats, historyData }) => (
            <div className="space-y-8 animate-fade-in">
                <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
                    <div className="bg-gradient-to-br from-indigo-600 to-violet-700 p-8 rounded-3xl text-white shadow-xl relative overflow-hidden">
                        <div className="absolute right-0 bottom-0 p-0 opacity-10 translate-x-10 translate-y-10"><DollarSign size={200}/></div>
                        <div className="flex items-center space-x-3 mb-4 opacity-90"><div className="p-2 bg-white/20 rounded-lg"><DollarSign size={24} /></div><span className="text-sm font-bold uppercase tracking-widest">Umsatz (Dieser Monat)</span></div>
                        <p className="text-6xl font-extrabold tracking-tight">{formatCurrency(stats.revenueMonth)}</p>
                    </div>
                    <div className="bg-gradient-to-br from-emerald-600 to-teal-700 p-8 rounded-3xl text-white shadow-xl relative overflow-hidden">
                        <div className="absolute right-0 top-0 p-6 opacity-10"><BarChart3 size={150}/></div>
                        <div className="flex items-center space-x-3 mb-4 opacity-90"><div className="p-2 bg-white/20 rounded-lg"><TrendingUp size={24} /></div><span className="text-sm font-bold uppercase tracking-widest">Gesamtumsatz (Jahr)</span></div>
                        <p className="text-6xl font-extrabold tracking-tight relative z-10">{formatCurrency(stats.revenueYear)}</p>
                    </div>
                </div>
                <div className="bg-white p-8 rounded-3xl border border-slate-100 shadow-sm">
                    <h2 className="text-2xl font-bold text-slate-800 flex items-center mb-6"><History className="mr-3 text-emerald-600" size={28}/> Monats-Rückblick</h2>
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                        {historyData.length > 0 ? historyData.map((data, idx) => <HistoryRow key={idx} month={data.monthName} revenue={data.revenue} count={data.count} />) : <div className="col-span-full p-8 text-center"><p className="text-slate-400 italic text-lg">Noch keine historischen Daten verfügbar.</p></div>}
                    </div>
                </div>
            </div>
        );

        const ListView = ({ bookings, onDeleteRequest, onToggleStatus }) => {
            const [listType, setListType] = useState('open'); 
            const [filterMascot, setFilterMascot] = useState('Alle');
            const [filterMonth, setFilterMonth] = useState('Alle');

            const availableMonths = useMemo(() => [...new Set(bookings.map(b => getMonthName(b.date)))].sort(), [bookings]);
            const filteredBookings = bookings.filter(b => {
                const isCompleted = b.status === 'completed';
                if (listType === 'open') return !isCompleted;
                if (listType === 'completed') return isCompleted;
                return true;
            }).filter(b => {
                if (filterMascot === 'Alle') return true;
                const bMascots = Array.isArray(b.mascot) ? b.mascot : [b.mascot];
                return bMascots.includes(filterMascot);
            }).filter(b => filterMonth === 'Alle' || getMonthName(b.date) === filterMonth).sort((a, b) => new Date(b.date) - new Date(a.date));

            return (
                <div className="animate-fade-in space-y-6">
                    <div className="flex flex-col md:flex-row justify-between items-center gap-4 bg-white p-4 rounded-2xl shadow-sm border border-slate-100">
                        <div className="flex bg-slate-100 p-1.5 rounded-xl w-full md:w-auto">
                            <button onClick={() => setListType('open')} className={`flex-1 md:flex-none px-6 py-2 text-sm font-bold rounded-lg transition-all ${listType === 'open' ? 'bg-white text-indigo-600 shadow-sm' : 'text-slate-500 hover:text-slate-700'}`}>Offen ({bookings.filter(b => b.status !== 'completed').length})</button>
                            <button onClick={() => setListType('completed')} className={`flex-1 md:flex-none px-6 py-2 text-sm font-bold rounded-lg transition-all ${listType === 'completed' ? 'bg-white text-green-600 shadow-sm' : 'text-slate-500 hover:text-slate-700'}`}>Erledigt ({bookings.filter(b => b.status === 'completed').length})</button>
                        </div>
                        <div className="flex space-x-3 w-full md:w-auto overflow-x-auto">
                            <select className="px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm font-semibold text-slate-700 focus:ring-2 focus:ring-indigo-500 outline-none" value={filterMascot} onChange={(e) => setFilterMascot(e.target.value)}>
                                <option value="Alle">🎭 Alle Maskottchen</option>
                                {MASCOTS.map(m => <option key={m} value={m}>{m}</option>)}
                            </select>
                            <select className="px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm font-semibold text-slate-700 focus:ring-2 focus:ring-indigo-500 outline-none" value={filterMonth} onChange={(e) => setFilterMonth(e.target.value)}>
                                <option value="Alle">📅 Alle Monate</option>
                                {availableMonths.map(m => <option key={m} value={m}>{m}</option>)}
                            </select>
                        </div>
                    </div>
                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                        {filteredBookings.length > 0 ? filteredBookings.map(booking => <BookingCard key={booking.id} booking={booking} onDeleteRequest={onDeleteRequest} onToggleStatus={onToggleStatus} />) : <div className="col-span-full p-20 text-center bg-slate-50 rounded-3xl border-2 border-dashed border-slate-200"><List size={48} className="mx-auto mb-4 text-slate-300" /><p className="text-slate-400 font-medium text-lg">Keine Aufträge in dieser Ansicht gefunden.</p></div>}
                    </div>
                </div>
            );
        };

        const AddFormView = ({ onAdd, onCancel, currentUser }) => {
            const now = new Date();
            const [formData, setFormData] = useState({ date: now.toISOString().split('T')[0], time: now.toTimeString().slice(0, 5), location: '', revenue: '', assignee: currentUser ? currentUser.name : '', contact: '', notes: '' });
            const [selectedMascots, setSelectedMascots] = useState([]);
            const [suggestions, setSuggestions] = useState([]);
            const [showSuggestions, setShowSuggestions] = useState(false);
            const [isGenerating, setIsGenerating] = useState(false);
            const [isSubmitting, setIsSubmitting] = useState(false);

            useEffect(() => {
                const timer = setTimeout(async () => {
                    if (formData.location.length > 2 && showSuggestions) {
                        try {
                            const response = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(formData.location)}&countrycodes=de&limit=5`);
                            setSuggestions(await response.json());
                        } catch (error) {}
                    } else { setSuggestions([]); }
                }, 500);
                return () => clearTimeout(timer);
            }, [formData.location, showSuggestions]);

            const handleAIGenerate = async () => {
                if (selectedMascots.length === 0) { alert("Bitte wähle zuerst ein Maskottchen aus!"); return; }
                setIsGenerating(true);
                try {
                    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ contents: [{ parts: [{ text: `Erstelle einen kurzen Ablaufplan für: Maskottchen ${selectedMascots.join(', ')}, ${formData.date} ${formData.time}, ${formData.location}. Sprache: Deutsch.` }] }] }) });
                    const data = await response.json();
                    setFormData(prev => ({ ...prev, notes: data.candidates[0].content.parts[0].text }));
                } catch (error) { alert("AI Fehler"); } finally { setIsGenerating(false); }
            };

            const handleSubmit = async (e) => {
                e.preventDefault();
                if (!formData.date || !formData.time || !formData.revenue || selectedMascots.length === 0) { alert("Bitte fülle alle Felder aus."); return; }
                setIsSubmitting(true);
                try {
                    await addDoc(collection(db, COL_NAME), {
                        date: `${formData.date}T${formData.time}`,
                        location: formData.location || "Kein Ort",
                        mascot: selectedMascots,
                        revenue: parseFloat(formData.revenue),
                        notes: formData.notes,
                        assignee: formData.assignee,
                        contact: formData.contact,
                        status: 'open',
                        createdAt: serverTimestamp()
                    });
                    onAdd(); 
                } catch(e) { console.error(e); alert("Fehler beim Speichern"); } 
                finally { setIsSubmitting(false); }
            };

            return (
                <div className="max-w-3xl mx-auto animate-fade-in">
                    <div className="bg-white p-8 rounded-3xl shadow-xl border border-slate-100">
                        <h2 className="text-3xl font-extrabold text-slate-800 mb-8 pb-4 border-b border-slate-100">Neuer Auftrag</h2>
                        <form onSubmit={handleSubmit} className="space-y-6">
                            <div className="grid grid-cols-2 gap-6">
                                <div><label className="block text-xs font-bold text-slate-500 mb-2 uppercase">Datum</label><input required type="date" className="w-full p-4 bg-slate-50 rounded-xl border border-slate-200" value={formData.date} onChange={e => setFormData({...formData, date: e.target.value})} /></div>
                                <div><label className="block text-xs font-bold text-slate-500 mb-2 uppercase">Uhrzeit</label><input required type="time" className="w-full p-4 bg-slate-50 rounded-xl border border-slate-200" value={formData.time} onChange={e => setFormData({...formData, time: e.target.value})} /></div>
                            </div>
                            <div className="relative z-50">
                                <label className="block text-xs font-bold text-slate-500 mb-2 uppercase">Ort</label>
                                <div className="relative"><MapPin className="absolute left-4 top-4 text-slate-400" size={20} /><input required type="text" className="w-full p-4 pl-12 bg-slate-50 rounded-xl border border-slate-200" value={formData.location} onChange={(e) => { setFormData({...formData, location: e.target.value}); setShowSuggestions(true); }} /></div>
                                {showSuggestions && suggestions.length > 0 && <div className="absolute top-full w-full bg-white rounded-xl shadow-2xl z-50">{suggestions.map((s,i) => <button key={i} type="button" className="w-full text-left p-4 hover:bg-indigo-50 border-b" onClick={() => { setFormData({...formData, location: s.display_name}); setShowSuggestions(false); }}>{s.display_name}</button>)}</div>}
                            </div>
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                <div><label className="block text-xs font-bold text-slate-500 mb-2 uppercase">Kontakt</label><div className="relative"><Phone className="absolute left-4 top-4 text-slate-400" size={20} /><input type="text" className="w-full p-4 pl-12 bg-slate-50 rounded-xl border border-slate-200" value={formData.contact} onChange={e => setFormData({...formData, contact: e.target.value})} /></div></div>
                                <div><label className="block text-xs font-bold text-slate-500 mb-2 uppercase">Umsatz (€)</label><div className="relative"><DollarSign className="absolute left-4 top-4 text-slate-400" size={20} /><input required type="number" step="0.01" className="w-full p-4 pl-12 bg-slate-50 rounded-xl border border-slate-200" value={formData.revenue} onChange={e => setFormData({...formData, revenue: e.target.value})} /></div></div>
                            </div>
                            <div>
                                <label className="block text-xs font-bold text-slate-500 mb-2 uppercase">Maskottchen</label>
                                <div className="flex flex-wrap gap-3">{MASCOTS.map(m => <button key={m} type="button" onClick={() => setSelectedMascots(p => p.includes(m) ? p.filter(x=>x!==m) : [...p, m])} className={`px-4 py-2.5 rounded-xl text-sm font-bold border ${selectedMascots.includes(m) ? 'bg-indigo-600 text-white' : 'bg-slate-50'}`}>{m}</button>)}</div>
                            </div>
                            <div><label className="block text-xs font-bold text-slate-500 mb-2 uppercase">Mitarbeiter</label><div className="relative"><UserCheck className="absolute left-4 top-4 text-slate-400" size={20} /><input type="text" className="w-full p-4 pl-12 bg-slate-50 rounded-xl border border-slate-200" value={formData.assignee} onChange={e => setFormData({...formData, assignee: e.target.value})} /></div></div>
                            <div>
                                <div className="flex justify-between items-end mb-2"><label className="block text-xs font-bold text-slate-500 uppercase">Notizen</label><button type="button" onClick={handleAIGenerate} disabled={isGenerating} className="text-xs font-bold text-purple-600 bg-purple-50 px-3 py-1.5 rounded-lg border border-purple-200">{isGenerating ? 'Lade...' : 'AI Planer'}</button></div>
                                <textarea rows="6" className="w-full p-4 bg-slate-50 rounded-xl border border-slate-200" value={formData.notes} onChange={e => setFormData({...formData, notes: e.target.value})}></textarea>
                            </div>
                            <div className="flex space-x-4 pt-4"><button type="button" onClick={onCancel} className="px-8 py-4 bg-slate-100 font-bold rounded-xl">Abbrechen</button><button type="submit" disabled={isSubmitting} className="flex-1 bg-indigo-600 text-white font-bold py-4 rounded-xl shadow-lg flex justify-center items-center">{isSubmitting ? <Loader2 className="animate-spin"/> : <><PlusCircle className="mr-2"/> Speichern</>}</button></div>
                        </form>
                    </div>
                </div>
            );
        };

        const ProfileView = ({ currentUser, onLogin, onLogout }) => {
            const [mode, setMode] = useState('login'); 
            const [formData, setFormData] = useState({ name: '', code: '' });
            const [error, setError] = useState('');
            const [notifState, setNotifState] = useState(Notification.permission);

            const handleSubmit = (e) => {
                e.preventDefault();
                const name = formData.name.trim();
                const code = formData.code;
                let valid = (code === TEAM_CODE || (name.toLowerCase() === 'semih' && code === SEMIH_CODE));
                if (!valid) { setError('Falscher Code!'); return; }
                if (!name) { setError('Bitte Namen eingeben.'); return; }
                onLogin(name);
            };

            const requestPermission = () => {
                Notification.requestPermission().then(p => {
                    setNotifState(p);
                    if(p === "granted") alert("Benachrichtigungen aktiviert!");
                });
            };

            if (currentUser) return (
                <div className="max-w-md mx-auto bg-white p-12 rounded-3xl shadow-xl text-center border border-slate-100 mt-12 animate-fade-in">
                    <div className="w-32 h-32 bg-indigo-100 rounded-full flex items-center justify-center mx-auto mb-6 shadow-inner"><UserCircle size={80} className="text-indigo-600" /></div>
                    <h2 className="text-4xl font-extrabold text-slate-800 mb-2">{currentUser.name}</h2>
                    <p className="text-indigo-600 font-semibold mb-8 bg-indigo-50 inline-block px-4 py-1.5 rounded-full">Team Mitglied</p>
                    
                    {notifState !== "granted" && (
                        <button onClick={requestPermission} className="w-full py-3 mb-4 rounded-2xl bg-indigo-50 text-indigo-700 font-bold hover:bg-indigo-100 transition-colors flex items-center justify-center border border-indigo-200">
                           <Bell size={20} className="mr-2"/> Benachrichtigungen aktivieren
                        </button>
                    )}

                    <button onClick={onLogout} className="w-full py-4 rounded-2xl bg-slate-100 text-slate-600 font-bold hover:bg-red-50 hover:text-red-600 transition-colors flex items-center justify-center text-lg"><LogOut size={22} className="mr-3" /> Abmelden</button>
                </div>
            );

            return (
                <div className="max-w-md mx-auto mt-20 animate-fade-in">
                    <div className="text-center mb-10"><h1 className="text-4xl font-extrabold text-slate-900 tracking-tight mb-2">{mode==='login'?'Willkommen':'Registrierung'}</h1><p className="text-slate-500 text-lg">ElegantEvent Management</p></div>
                    <div className="bg-white p-8 rounded-3xl shadow-2xl border border-slate-100">
                        <div className="flex bg-slate-100 p-1.5 rounded-2xl mb-8">
                            <button onClick={() => setMode('login')} className={`flex-1 py-3 text-sm font-bold rounded-xl ${mode==='login'?'bg-white shadow-sm text-indigo-600':'text-slate-500'}`}>Anmelden</button>
                            <button onClick={() => setMode('register')} className={`flex-1 py-3 text-sm font-bold rounded-xl ${mode==='register'?'bg-white shadow-sm text-indigo-600':'text-slate-500'}`}>Registrieren</button>
                        </div>
                        <form onSubmit={handleSubmit} className="space-y-6">
                            {error && <div className="bg-red-50 text-red-600 p-4 rounded-xl text-sm font-bold">{error}</div>}
                            <div><label className="block text-xs font-bold text-slate-500 mb-2 uppercase">Name</label><input type="text" className="w-full p-4 bg-slate-50 rounded-xl border" value={formData.name} onChange={e=>setFormData({...formData,name:e.target.value})} /></div>
                            <div><label className="block text-xs font-bold text-slate-500 mb-2 uppercase">Code</label><input type="password" className="w-full p-4 bg-slate-50 rounded-xl border" value={formData.code} onChange={e=>setFormData({...formData,code:e.target.value})} /></div>
                            <button type="submit" className="w-full bg-indigo-600 text-white font-bold py-4 rounded-xl shadow-lg text-lg">Starten</button>
                        </form>
                    </div>
                </div>
            );
        };

        const Navbar = ({ activeTab, setActiveTab, currentUser, onLogout }) => (
            <nav className="bg-white border-b border-slate-200 sticky top-0 z-[50]">
                <div className="container mx-auto px-6 h-20 flex items-center justify-between">
                    <div className="flex items-center space-x-3 cursor-pointer" onClick={() => setActiveTab('dashboard')}>
                        <div className="w-10 h-10 bg-indigo-600 rounded-xl flex items-center justify-center shadow-lg"><span className="text-2xl">🎭</span></div>
                        <div><h1 className="text-xl font-extrabold text-slate-900 leading-none">ElegantEvent</h1><p className="text-xs text-indigo-600 font-bold uppercase">Management</p></div>
                    </div>
                    {currentUser && (
                        <div className="hidden md:flex items-center space-x-2 bg-slate-50 p-1.5 rounded-2xl border">
                            {[ {id:'dashboard',icon:LayoutDashboard,l:'Dashboard'}, {id:'list',icon:List,l:'Liste'}, {id:'finance',icon:PieChart,l:'Finanzen'} ].map(i => 
                                <button key={i.id} onClick={()=>setActiveTab(i.id)} className={`flex items-center px-5 py-2.5 rounded-xl text-sm font-bold ${activeTab===i.id?'bg-white text-indigo-600 shadow-sm':'text-slate-500'}`}><i.icon size={18} className="mr-2"/>{i.l}</button>
                            )}
                        </div>
                    )}
                    <div className="flex items-center space-x-4">
                        {currentUser && <button onClick={() => setActiveTab('add')} className="hidden md:flex items-center px-6 py-3 bg-indigo-600 text-white rounded-xl font-bold shadow-lg"><PlusCircle size={20} className="mr-2" /> Neu</button>}
                        {currentUser ? <button onClick={() => setActiveTab('profile')} className="flex items-center space-x-3 px-3 py-2 bg-slate-50 rounded-xl"><span className="text-sm font-bold">{currentUser.name}</span><div className="w-8 h-8 bg-indigo-100 rounded-full flex items-center justify-center text-indigo-700 font-bold">{currentUser.name[0]}</div></button> : <span className="text-sm font-bold text-slate-400"><Lock size={16} className="inline mr-1"/> Login</span>}
                    </div>
                </div>
                {currentUser && (
                    <div className="md:hidden fixed bottom-0 left-0 w-full bg-white border-t pb-safe z-50 px-6 py-3 flex justify-between shadow-2xl">
                         <button onClick={()=>setActiveTab('dashboard')} className={`flex flex-col items-center ${activeTab==='dashboard'?'text-indigo-600':'text-slate-400'}`}><LayoutDashboard size={24}/></button>
                         <button onClick={()=>setActiveTab('list')} className={`flex flex-col items-center ${activeTab==='list'?'text-indigo-600':'text-slate-400'}`}><List size={24}/></button>
                         <button onClick={()=>setActiveTab('add')} className="relative -top-6 bg-indigo-600 text-white p-4 rounded-full shadow-lg border-4 border-slate-50"><PlusCircle size={28}/></button>
                         <button onClick={()=>setActiveTab('finance')} className={`flex flex-col items-center ${activeTab==='finance'?'text-indigo-600':'text-slate-400'}`}><PieChart size={24}/></button>
                         <button onClick={()=>setActiveTab('profile')} className={`flex flex-col items-center ${activeTab==='profile'?'text-indigo-600':'text-slate-400'}`}><UserCircle size={24}/></button>
                    </div>
                )}
            </nav>
        );

        function MascotApp() {
            const [activeTab, setActiveTab] = useState('profile');
            const [bookings, setBookings] = useState([]);
            const [currentUser, setCurrentUser] = useState(null); 
            const [isLoaded, setIsLoaded] = useState(false);
            const [toast, setToast] = useState(null);
            const [deleteModalOpen, setDeleteModalOpen] = useState(false);
            const [itemToDelete, setItemToDelete] = useState(null);
            const isInitialLoad = useRef(true);

            // --- FIREBASE SYNC MIT NATIVE NOTIFICATIONS ---
            useEffect(() => {
                const q = query(collection(db, COL_NAME), orderBy("date", "desc"));
                const unsubscribe = onSnapshot(q, (snapshot) => {
                    const jobs = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                    setBookings(jobs);
                    setIsLoaded(true);

                    // --- BENACHRICHTIGUNG LOGIK ---
                    if (!isInitialLoad.current) {
                        snapshot.docChanges().forEach((change) => {
                            if (change.type === "added") {
                                const newJob = change.doc.data();
                                // Benachrichtige nur, wenn ich nicht selbst der Ersteller bin
                                if (currentUser && newJob.assignee !== currentUser.name) {
                                    if (Notification.permission === "granted") {
                                        new Notification("Neuer Auftrag!", {
                                            body: `${newJob.revenue}€ - ${newJob.contact}`,
                                            icon: "https://cdn-icons-png.flaticon.com/512/3135/3135715.png"
                                        });
                                    }
                                }
                            }
                        });
                    }
                    isInitialLoad.current = false;
                });
                return () => unsubscribe();
            }, [currentUser]); // Abhängigkeit von currentUser, damit wir wissen wer wir sind

            useEffect(() => {
                const savedUser = localStorage.getItem('mascot_user');
                if (savedUser) { setCurrentUser(JSON.parse(savedUser)); setActiveTab('dashboard'); }
            }, []);

            useEffect(() => { 
                if (currentUser) localStorage.setItem('mascot_user', JSON.stringify(currentUser)); 
                else localStorage.removeItem('mascot_user'); 
            }, [currentUser]);

            const addBooking = () => { setActiveTab('list'); setToast({ message: "Auftrag gespeichert!", type: "success" }); };
            const requestDelete = (id) => { setItemToDelete(id); setDeleteModalOpen(true); };
            const confirmDelete = async () => { if (itemToDelete) { await deleteDoc(doc(db, COL_NAME, itemToDelete)); setToast({ message: "Gelöscht.", type: "success" }); } setDeleteModalOpen(false); setItemToDelete(null); };
            const toggleStatus = async (id, currentStatus) => { const newStatus = currentStatus === 'completed' ? 'open' : 'completed'; await updateDoc(doc(db, COL_NAME, id), { status: newStatus }); };

            const handleLogin = (name) => { setCurrentUser({ name }); setActiveTab('dashboard'); };
            const handleLogout = () => { setCurrentUser(null); setActiveTab('profile'); };

            const stats = useMemo(() => {
                const now = new Date();
                const currentMonth = now.getMonth();
                const currentYear = now.getFullYear();
                const revenueMonth = bookings.filter(b => { const d = new Date(b.date); return d.getMonth() === currentMonth && d.getFullYear() === currentYear; }).reduce((sum, b) => sum + Number(b.revenue), 0);
                const revenueYear = bookings.filter(b => new Date(b.date).getFullYear() === currentYear).reduce((sum, b) => sum + Number(b.revenue), 0);
                const upcoming = bookings.filter(b => b.status !== 'completed' && new Date(b.date) > now).sort((a, b) => new Date(a.date) - new Date(b.date));
                return { revenueMonth, revenueYear, openCount: bookings.filter(b => b.status !== 'completed').length, completedCount: bookings.filter(b => b.status === 'completed').length, nextThree: upcoming.slice(0, 3) };
            }, [bookings]);

            const historyData = useMemo(() => {
                const groups = {};
                bookings.forEach(b => {
                    const d = new Date(b.date);
                    const key = `${d.getFullYear()}-${d.getMonth()}`; 
                    if (!groups[key]) groups[key] = { monthName: d.toLocaleDateString('de-DE', { month: 'long', year: 'numeric' }), revenue: 0, count: 0, sortKey: d.getTime() };
                    groups[key].revenue += Number(b.revenue); groups[key].count += 1;
                });
                return Object.values(groups).sort((a, b) => b.sortKey - a.sortKey).slice(0, 6); 
            }, [bookings]);

            return (
                <div className="min-h-screen bg-slate-50 font-sans text-slate-900 flex flex-col">
                    {toast && <Toast message={toast.message} type={toast.type} onClose={() => setToast(null)} />}
                    <ConfirmModal isOpen={deleteModalOpen} title="Löschen?" message="Endgültig löschen?" onConfirm={confirmDelete} onCancel={() => setDeleteModalOpen(false)} />
                    <Navbar activeTab={activeTab} setActiveTab={setActiveTab} currentUser={currentUser} onLogout={handleLogout} />
                    <main className="container mx-auto px-4 md:px-6 py-8 flex-1">
                        {!currentUser ? ( <ProfileView currentUser={currentUser} onLogin={handleLogin} onLogout={handleLogout} /> ) : (
                            <>
                                {activeTab === 'dashboard' && <DashboardView stats={stats} onDeleteRequest={requestDelete} onToggleStatus={toggleStatus} currentUser={currentUser} />}
                                {activeTab === 'list' && <ListView bookings={bookings} onDeleteRequest={requestDelete} onToggleStatus={toggleStatus} />}
                                {activeTab === 'finance' && <FinancialView stats={stats} historyData={historyData} />}
                                {activeTab === 'profile' && <ProfileView currentUser={currentUser} onLogin={handleLogin} onLogout={handleLogout} />}
                                {activeTab === 'add' && <AddFormView onAdd={addBooking} onCancel={() => setActiveTab('dashboard')} currentUser={currentUser} />}
                            </>
                        )}
                    </main>
                    <div className="py-6 text-center text-slate-400 text-xs font-medium">ElegantEvent Manager v1.5 • <Bell size={10} className="inline mr-1"/> Browser-Benachrichtigungen</div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<MascotApp />);
    </script>
</body>
</html>
