<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>ElegantEvent Manager</title>
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#ffffff">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        /* Animationen */
        @keyframes bounceIn { 0% { transform: scale(0.95); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
        @keyframes fadeIn { 0% { opacity: 0; } 100% { opacity: 1; } }
        .animate-bounce-in { animation: bounceIn 0.4s cubic-bezier(0.18, 0.89, 0.32, 1.28) forwards; }
        .animate-fade-in { animation: fadeIn 0.3s ease-out forwards; }
        
        /* iOS Optimierungen */
        .pb-safe { padding-bottom: env(safe-area-inset-bottom); }
        .pt-safe { padding-top: env(safe-area-inset-top); }
        body { -webkit-tap-highlight-color: transparent; user-select: none; font-family: -apple-system, system-ui, sans-serif; }
        
        /* Lade & Fehler Screen */
        #loader { position: fixed; inset: 0; background: white; z-index: 9999; display: flex; justify-content: center; align-items: center; flex-direction: column; }
        #error-box { display: none; position: fixed; inset: 0; background: #fee2e2; color: #991b1b; padding: 40px; z-index: 10000; font-family: monospace; overflow: auto; white-space: pre-wrap; }
    </style>
</head>
<body class="bg-slate-50 text-slate-900">

    <div id="loader">
        <div class="w-12 h-12 border-4 border-indigo-100 border-t-indigo-600 rounded-full animate-spin mb-4"></div>
        <div class="text-indigo-900 font-bold text-lg tracking-tight">ElegantEvent wird geladen...</div>
    </div>

    <div id="error-box"></div>

    <div id="root"></div>

    <script>
        window.onerror = function(msg, url, line) {
            document.getElementById('loader').style.display = 'none';
            document.getElementById('error-box').style.display = 'block';
            document.getElementById('error-box').innerHTML = "⚠️ KRITISCHER FEHLER:\n" + msg + "\n\nZeile: " + line + "\n\nBitte Screenshot machen.";
        };
    </script>

    <script type="text/babel" data-type="module">
        import React, { useState, useEffect, useMemo, useRef } from 'https://esm.sh/react@18.2.0';
        import ReactDOM from 'https://esm.sh/react-dom@18.2.0/client';
        import { 
            LayoutDashboard, List, PlusCircle, MapPin, Calendar, DollarSign, Trash2,
            TrendingUp, Clock, CheckCircle, AlertCircle, CheckSquare, UserCheck,
            Archive, History, PieChart, Phone, Navigation, BarChart3, UserCircle,
            LogOut, Lock, UserPlus, LogIn, Loader2, CloudOff, Sparkles, Cloud, Bell, X
        } from 'https://esm.sh/lucide-react@0.292.0';

        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { 
            getFirestore, collection, addDoc, onSnapshot, 
            query, orderBy, doc, deleteDoc, updateDoc, serverTimestamp 
        } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // --- KONFIGURATION ---
        const firebaseConfig = {
            apiKey: "AIzaSyAugljddmPLH4QAKy2X2AaiOG4qp9IQg8c",
            authDomain: "elegantevent-27d55.firebaseapp.com",
            projectId: "elegantevent-27d55",
            storageBucket: "elegantevent-27d55.firebasestorage.app",
            messagingSenderId: "13045694360",
            appId: "1:13045694360:web:b05d85ed441e9895c3f5ed",
            measurementId: "G-V9JERJCHXR"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const COL_NAME = "auftraege";
        
        // Konstanten & Daten
        const MASCOTS = [
            "Chase (Paw Patrol)", "Marshall (Paw Patrol)", "Skye (Paw Patrol)", 
            "Sonic", "Stitch", "Micky Maus", "Minnie Maus", 
            "Mario", "Luigi", "Mascha", "Der Bär", "Spiderman"
        ];
        const TEAM_CODE = "maskottchen"; 
        const SEMIH_CODE = "Semih2005"; 
        const apiKey = ""; // API Key für AI Features (optional)

        // --- HELPER ---
        const formatCurrency = (amount) => new Intl.NumberFormat('de-DE', { style: 'currency', currency: 'EUR' }).format(amount);
        const formatDate = (d) => { if(!d) return ''; const date = new Date(d); return isNaN(date) ? d : date.toLocaleDateString('de-DE', { weekday: 'short', day: '2-digit', month: '2-digit', year: 'numeric' }); };
        const getMonthName = (d) => { if(!d) return ''; const date = new Date(d); return isNaN(date) ? '' : date.toLocaleDateString('de-DE', { month: 'long', year: 'numeric' }); };

        // --- UI KOMPONENTEN ---

        const Toast = ({ message, type = 'success', onClose }) => {
            useEffect(() => { const t = setTimeout(onClose, 3000); return () => clearTimeout(t); }, [onClose]);
            return (
                <div className={`fixed top-6 right-4 left-4 md:left-auto md:w-auto z-[200] p-4 rounded-2xl shadow-2xl flex items-center space-x-3 animate-bounce-in border ${type === 'success' ? 'bg-white border-green-500 text-green-800' : 'bg-white border-red-500 text-red-800'}`}>
                    {type === 'success' ? <CheckCircle size={24} className="text-green-500"/> : <AlertCircle size={24} className="text-red-500"/>}
                    <span className="font-bold">{message}</span>
                </div>
            );
        };

        const ConfirmModal = ({ isOpen, title, message, onConfirm, onCancel }) => {
            if (!isOpen) return null;
            return (
                <div className="fixed inset-0 z-[200] flex items-center justify-center bg-black/40 backdrop-blur-sm p-4 animate-fade-in">
                    <div className="bg-white rounded-3xl shadow-2xl w-full max-w-sm overflow-hidden p-6 transform scale-100 transition-all">
                        <h3 className="text-2xl font-black text-slate-800 mb-2">{title}</h3>
                        <p className="text-slate-500 mb-8 font-medium leading-relaxed">{message}</p>
                        <div className="flex gap-3">
                            <button onClick={onCancel} className="flex-1 py-3 rounded-xl bg-slate-100 text-slate-600 font-bold">Abbruch</button>
                            <button onClick={onConfirm} className="flex-1 py-3 rounded-xl bg-red-500 text-white font-bold shadow-lg shadow-red-200">Löschen</button>
                        </div>
                    </div>
                </div>
            );
        };

        const BookingCard = ({ booking, onDeleteRequest, onToggleStatus }) => {
            const isCompleted = booking.status === 'completed';
            const isPast = new Date(booking.date) < new Date();
            const mascotList = Array.isArray(booking.mascot) ? booking.mascot : [booking.mascot];
            const timeStr = new Date(booking.date).toLocaleTimeString('de-DE', {hour:'2-digit', minute:'2-digit'});

            return (
                <div className={`relative bg-white rounded-[1.5rem] p-5 border border-slate-100 shadow-sm transition-all mb-4 ${isCompleted ? 'opacity-60 grayscale-[0.5]' : 'hover:shadow-md'}`}>
                    <div className={`absolute left-0 top-6 bottom-6 w-1.5 rounded-r-full ${isCompleted ? 'bg-emerald-400' : isPast ? 'bg-slate-300' : 'bg-indigo-500'}`}></div>
                    
                    <div className="pl-4">
                        <div className="flex justify-between items-start mb-3">
                            <div className="flex flex-wrap gap-1.5">
                                {mascotList.map((m, i) => (
                                    <span key={i} className={`px-2.5 py-1 rounded-lg text-[10px] font-black uppercase tracking-wider border ${isCompleted ? 'bg-emerald-50 text-emerald-600 border-emerald-100' : 'bg-indigo-50 text-indigo-600 border-indigo-100'}`}>
                                        {m}
                                    </span>
                                ))}
                            </div>
                            <div className="flex gap-2">
                                <button onClick={(e) => {e.stopPropagation(); onToggleStatus(booking.id, booking.status)}} className={`p-2 rounded-full ${isCompleted ? 'bg-emerald-100 text-emerald-600' : 'bg-slate-100 text-slate-400'}`}><CheckSquare size={18}/></button>
                                <button onClick={(e) => {e.stopPropagation(); onDeleteRequest(booking.id)}} className="p-2 rounded-full bg-red-50 text-red-400"><Trash2 size={18}/></button>
                            </div>
                        </div>

                        <h3 className="text-lg font-extrabold text-slate-800 mb-1 flex items-center">
                            {formatDate(booking.date)} <span className="text-slate-300 mx-2">|</span> {timeStr}
                        </h3>
                        
                        <div className="space-y-1 mb-4">
                            <div className="flex items-start text-sm font-medium text-slate-600">
                                <MapPin size={16} className="mr-2 mt-0.5 text-indigo-400 shrink-0"/>
                                <a href={`https://maps.google.com/?q=${encodeURIComponent(booking.location)}`} target="_blank" className="underline decoration-slate-200">{booking.location}</a>
                            </div>
                            {booking.contact && (
                                <div className="flex items-center text-sm font-bold text-slate-700">
                                    <Phone size={16} className="mr-2 text-indigo-400 shrink-0"/>
                                    <a href={`tel:${booking.contact}`}>{booking.contact}</a>
                                </div>
                            )}
                        </div>

                        <div className="pt-4 border-t border-slate-50 flex justify-between items-end">
                            <div className="flex flex-col">
                                <span className="text-[10px] font-bold text-slate-400 uppercase tracking-wider">Erstellt von</span>
                                <div className="flex items-center text-xs font-bold text-indigo-600 bg-indigo-50 px-2 py-1 rounded-md mt-1 w-fit">
                                    <UserCheck size={12} className="mr-1"/> {booking.assignee || "Unbekannt"}
                                </div>
                            </div>
                            <div className="text-xl font-black text-slate-800 bg-slate-50 px-3 py-1 rounded-xl border border-slate-100">
                                {formatCurrency(booking.revenue)}
                            </div>
                        </div>
                        
                        {booking.notes && (
                            <div className="mt-3 text-xs text-slate-500 bg-slate-50 p-3 rounded-xl italic border border-slate-100">
                                "{booking.notes}"
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        // --- ANSICHTEN ---

        const DashboardView = ({ stats, onDeleteRequest, onToggleStatus }) => (
            <div className="space-y-8 animate-fade-in pb-20">
                {/* KPI CARDS */}
                <div className="grid grid-cols-2 gap-4">
                    <div className="bg-white p-5 rounded-[1.5rem] border border-slate-100 shadow-sm relative overflow-hidden">
                        <div className="absolute -right-4 -top-4 w-20 h-20 bg-indigo-50 rounded-full opacity-50"></div>
                        <span className="relative z-10 flex items-center text-xs font-bold text-slate-400 uppercase tracking-wider mb-2"><Clock size={14} className="mr-1 text-indigo-500"/> Offen</span>
                        <div className="relative z-10 text-4xl font-black text-slate-800">{stats.openCount}</div>
                    </div>
                    <div className="bg-white p-5 rounded-[1.5rem] border border-slate-100 shadow-sm relative overflow-hidden">
                        <div className="absolute -right-4 -top-4 w-20 h-20 bg-emerald-50 rounded-full opacity-50"></div>
                        <span className="relative z-10 flex items-center text-xs font-bold text-slate-400 uppercase tracking-wider mb-2"><CheckCircle size={14} className="mr-1 text-emerald-500"/> Erledigt</span>
                        <div className="relative z-10 text-4xl font-black text-slate-800">{stats.completedCount}</div>
                    </div>
                </div>

                {/* NEXT UP */}
                <div>
                    <h2 className="text-2xl font-black text-slate-800 mb-6 flex items-center"><Calendar className="mr-2 text-indigo-600"/> Demnächst</h2>
                    {stats.nextThree.length > 0 ? (
                        stats.nextThree.map(b => <BookingCard key={b.id} booking={b} onDeleteRequest={onDeleteRequest} onToggleStatus={onToggleStatus} />)
                    ) : (
                        <div className="p-10 text-center bg-white rounded-3xl border-2 border-dashed border-slate-200 text-slate-400 font-medium">Alles erledigt! 🎉</div>
                    )}
                </div>
            </div>
        );

        const ListView = ({ bookings, onDeleteRequest, onToggleStatus }) => {
            const [filter, setFilter] = useState('open');
            const filtered = bookings.filter(b => filter === 'open' ? b.status !== 'completed' : b.status === 'completed');
            
            return (
                <div className="animate-fade-in pb-20">
                    <div className="bg-slate-200 p-1 rounded-2xl flex mb-6">
                        <button onClick={()=>setFilter('open')} className={`flex-1 py-3 rounded-xl text-sm font-bold transition-all ${filter==='open'?'bg-white shadow-sm text-indigo-600':'text-slate-500'}`}>Offene Aufträge</button>
                        <button onClick={()=>setFilter('completed')} className={`flex-1 py-3 rounded-xl text-sm font-bold transition-all ${filter==='completed'?'bg-white shadow-sm text-emerald-600':'text-slate-500'}`}>Historie</button>
                    </div>
                    <div className="space-y-4">
                        {filtered.length > 0 ? filtered.map(b => <BookingCard key={b.id} booking={b} onDeleteRequest={onDeleteRequest} onToggleStatus={onToggleStatus} />) : <div className="text-center py-12 text-slate-400">Keine Einträge gefunden.</div>}
                    </div>
                </div>
            );
        };

        const AddFormView = ({ onAdd, onCancel, currentUser }) => {
            const now = new Date();
            const [formData, setFormData] = useState({ date: now.toISOString().split('T')[0], time: "14:00", location: '', revenue: '', assignee: currentUser?.name || '', contact: '', notes: '' });
            const [selectedMascots, setSelectedMascots] = useState([]);
            const [isSubmitting, setIsSubmitting] = useState(false);
            const [suggestions, setSuggestions] = useState([]);

            // Auto-Suggest für Adresse
            useEffect(() => {
                if(formData.location.length > 3) {
                    const t = setTimeout(async () => {
                        try {
                            const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(formData.location)}&countrycodes=de&limit=3`);
                            setSuggestions(await res.json());
                        } catch(e){}
                    }, 500);
                    return () => clearTimeout(t);
                } else { setSuggestions([]); }
            }, [formData.location]);

            const handleSubmit = async (e) => {
                e.preventDefault();
                if(!formData.date || !formData.revenue || selectedMascots.length === 0) { alert("Bitte Datum, Preis und Maskottchen angeben!"); return; }
                setIsSubmitting(true);
                try {
                    await addDoc(collection(db, COL_NAME), {
                        ...formData,
                        date: `${formData.date}T${formData.time}`,
                        location: formData.location || "Kein Ort",
                        revenue: parseFloat(formData.revenue),
                        mascot: selectedMascots,
                        status: 'open',
                        createdAt: serverTimestamp()
                    });
                    onAdd();
                } catch(e) { alert("Fehler: " + e.message); }
                finally { setIsSubmitting(false); }
            };

            const generateAI = async () => {
                if(selectedMascots.length === 0) return alert("Wähle erst ein Maskottchen!");
                setFormData(p => ({...p, notes: "Lade AI Vorschlag..."}));
                try {
                    const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`, {
                        method:'POST', headers:{'Content-Type':'application/json'},
                        body: JSON.stringify({ contents: [{ parts: [{ text: `Erstelle Ablaufplan für: ${selectedMascots.join(', ')} Event am ${formData.date}. Ort: ${formData.location}.` }] }] })
                    });
                    const data = await res.json();
                    setFormData(p => ({...p, notes: data.candidates[0].content.parts[0].text}));
                } catch(e) { setFormData(p => ({...p, notes: "Fehler bei AI."})); }
            };

            return (
                <div className="animate-fade-in pb-32">
                    <div className="bg-white p-6 rounded-[2rem] shadow-xl border border-slate-100">
                        <h2 className="text-2xl font-black text-slate-800 mb-6 border-b border-slate-50 pb-4">Neuer Auftrag</h2>
                        <form onSubmit={handleSubmit} className="space-y-5">
                            <div className="grid grid-cols-2 gap-4">
                                <div><label className="text-xs font-bold text-slate-400 uppercase ml-2">Datum</label><input type="date" className="w-full p-4 bg-slate-50 rounded-2xl outline-none font-bold" value={formData.date} onChange={e=>setFormData({...formData, date:e.target.value})}/></div>
                                <div><label className="text-xs font-bold text-slate-400 uppercase ml-2">Zeit</label><input type="time" className="w-full p-4 bg-slate-50 rounded-2xl outline-none font-bold" value={formData.time} onChange={e=>setFormData({...formData, time:e.target.value})}/></div>
                            </div>

                            <div className="relative">
                                <label className="text-xs font-bold text-slate-400 uppercase ml-2">Ort</label>
                                <input type="text" placeholder="Adresse eingeben..." className="w-full p-4 bg-slate-50 rounded-2xl outline-none font-medium" value={formData.location} onChange={e=>setFormData({...formData, location:e.target.value})}/>
                                {suggestions.length > 0 && <div className="absolute top-full left-0 right-0 bg-white shadow-xl rounded-2xl z-50 mt-2 border border-slate-100 overflow-hidden">{suggestions.map((s,i)=><div key={i} onClick={()=>{setFormData({...formData, location:s.display_name}); setSuggestions([])}} className="p-3 border-b border-slate-50 text-sm truncate hover:bg-slate-50">{s.display_name}</div>)}</div>}
                            </div>

                            <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                <div><label className="text-xs font-bold text-slate-400 uppercase ml-2">Kunde</label><input type="text" placeholder="Name / Tel" className="w-full p-4 bg-slate-50 rounded-2xl outline-none" value={formData.contact} onChange={e=>setFormData({...formData, contact:e.target.value})}/></div>
                                <div><label className="text-xs font-bold text-slate-400 uppercase ml-2">Preis (€)</label><input type="number" placeholder="0.00" className="w-full p-4 bg-slate-50 rounded-2xl outline-none font-black text-indigo-600" value={formData.revenue} onChange={e=>setFormData({...formData, revenue:e.target.value})}/></div>
                            </div>

                            <div>
                                <label className="text-xs font-bold text-slate-400 uppercase ml-2 mb-2 block">Maskottchen</label>
                                <div className="flex flex-wrap gap-2">
                                    {MASCOTS.map(m => (
                                        <button key={m} type="button" onClick={()=>setSelectedMascots(p => p.includes(m)?p.filter(x=>x!==m):[...p,m])} className={`px-3 py-2 rounded-xl text-xs font-bold border transition-all ${selectedMascots.includes(m)?'bg-indigo-600 text-white border-indigo-600 shadow-md':'bg-white text-slate-500 border-slate-200'}`}>{m}</button>
                                    ))}
                                </div>
                            </div>

                            <div>
                                <div className="flex justify-between items-center mb-1">
                                    <label className="text-xs font-bold text-slate-400 uppercase ml-2">Notizen</label>
                                    <button type="button" onClick={generateAI} className="text-[10px] font-bold bg-purple-50 text-purple-600 px-2 py-1 rounded-lg flex items-center border border-purple-100"><Sparkles size={10} className="mr-1"/> AI Planer</button>
                                </div>
                                <textarea rows="4" className="w-full p-4 bg-slate-50 rounded-2xl outline-none text-sm" value={formData.notes} onChange={e=>setFormData({...formData, notes:e.target.value})}></textarea>
                            </div>

                            <div className="flex gap-4 pt-2">
                                <button type="button" onClick={onCancel} className="px-6 py-4 rounded-2xl font-bold text-slate-500 bg-slate-100">Abbruch</button>
                                <button type="submit" disabled={isSubmitting} className="flex-1 py-4 rounded-2xl font-bold text-white bg-indigo-600 shadow-lg shadow-indigo-200 flex justify-center items-center">
                                    {isSubmitting ? <Loader2 className="animate-spin"/> : <><PlusCircle className="mr-2"/> Speichern</>}
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            );
        };

        const FinancialView = ({ stats, historyData }) => (
            <div className="space-y-6 animate-fade-in pb-20">
                <div className="bg-gradient-to-br from-indigo-600 to-purple-700 p-8 rounded-[2rem] text-white shadow-xl shadow-indigo-200 relative overflow-hidden">
                    <DollarSign size={180} className="absolute -right-8 -bottom-12 opacity-10"/>
                    <div className="relative z-10">
                        <span className="text-indigo-200 font-bold uppercase tracking-widest text-xs">Umsatz Monat</span>
                        <div className="text-5xl font-black mt-2 mb-1">{formatCurrency(stats.revenueMonth)}</div>
                        <div className="text-indigo-200 text-sm">Jahr: {formatCurrency(stats.revenueYear)}</div>
                    </div>
                </div>

                <div className="bg-white p-6 rounded-[2rem] border border-slate-100 shadow-sm">
                    <h3 className="font-bold text-slate-800 mb-4 flex items-center"><BarChart3 size={18} className="mr-2 text-indigo-500"/> Monats-Vergleich</h3>
                    <div className="space-y-3">
                        {historyData.map((h, i) => (
                            <div key={i} className="flex justify-between items-center p-3 bg-slate-50 rounded-xl">
                                <div>
                                    <div className="font-bold text-slate-700">{h.monthName}</div>
                                    <div className="text-xs text-slate-400">{h.count} Aufträge</div>
                                </div>
                                <div className="font-black text-slate-800">{formatCurrency(h.revenue)}</div>
                            </div>
                        ))}
                    </div>
                </div>
            </div>
        );

        const ProfileView = ({ currentUser, onLogin, onLogout }) => {
            const [mode, setMode] = useState('login'); 
            const [form, setForm] = useState({ name: '', code: '' });
            const [permission, setPermission] = useState(Notification.permission);

            const reqPerm = () => {
                Notification.requestPermission().then(p => {
                    setPermission(p);
                    if(p==='granted') new Notification("Test", {body:"Aktiviert!"});
                });
            };

            const handleSub = (e) => {
                e.preventDefault();
                const valid = (form.code === TEAM_CODE || (form.name.toLowerCase()==='semih' && form.code===SEMIH_CODE));
                if(valid && form.name) onLogin(form.name); else alert("Daten falsch!");
            };

            if(currentUser) return (
                <div className="p-8 bg-white rounded-[2rem] shadow-xl text-center border border-slate-100 animate-fade-in mt-10">
                    <div className="w-24 h-24 bg-indigo-50 text-indigo-600 rounded-full flex items-center justify-center mx-auto mb-4"><UserCircle size={64}/></div>
                    <h2 className="text-2xl font-black text-slate-800">{currentUser.name}</h2>
                    <p className="text-slate-400 font-bold text-sm mb-8">Team Mitglied</p>
                    
                    {permission !== 'granted' && (
                        <button onClick={reqPerm} className="w-full py-3 mb-3 bg-indigo-50 text-indigo-700 font-bold rounded-xl flex items-center justify-center"><Bell size={18} className="mr-2"/> Push aktivieren</button>
                    )}
                    
                    <button onClick={onLogout} className="w-full py-4 bg-slate-100 text-slate-600 font-bold rounded-xl flex items-center justify-center"><LogOut size={18} className="mr-2"/> Abmelden</button>
                </div>
            );

            return (
                <div className="mt-20 animate-fade-in max-w-sm mx-auto">
                    <div className="text-center mb-8">
                        <h1 className="text-4xl font-black text-indigo-900 mb-2">ElegantEvent</h1>
                        <p className="text-slate-400 font-medium">Management Portal v2.0</p>
                    </div>
                    <div className="bg-white p-8 rounded-[2rem] shadow-2xl border border-slate-100">
                        <form onSubmit={handleSub} className="space-y-4">
                            <input type="text" placeholder="Dein Name" className="w-full p-4 bg-slate-50 rounded-xl font-bold outline-none" value={form.name} onChange={e=>setForm({...form,name:e.target.value})}/>
                            <input type="password" placeholder="Zugangscode" className="w-full p-4 bg-slate-50 rounded-xl font-bold outline-none" value={form.code} onChange={e=>setForm({...form,code:e.target.value})}/>
                            <button className="w-full py-4 bg-indigo-600 text-white font-bold rounded-xl shadow-lg shadow-indigo-200">Starten</button>
                        </form>
                    </div>
                </div>
            );
        };

        const Navbar = ({ tab, setTab, user }) => {
            if(!user) return null;
            return (
                <nav className="fixed bottom-0 left-0 w-full bg-white/90 backdrop-blur-xl border-t border-slate-200 pb-safe z-50">
                    <div className="flex justify-around items-center px-2 py-3">
                        <button onClick={()=>setTab('dashboard')} className={`p-2 rounded-xl flex flex-col items-center transition-all ${tab==='dashboard'?'text-indigo-600 bg-indigo-50':'text-slate-400'}`}><LayoutDashboard size={24}/><span className="text-[10px] font-bold mt-1">Home</span></button>
                        <button onClick={()=>setTab('list')} className={`p-2 rounded-xl flex flex-col items-center transition-all ${tab==='list'?'text-indigo-600 bg-indigo-50':'text-slate-400'}`}><List size={24}/><span className="text-[10px] font-bold mt-1">Liste</span></button>
                        <button onClick={()=>setTab('add')} className="relative -top-8 bg-indigo-600 text-white p-4 rounded-full shadow-xl shadow-indigo-200 border-[6px] border-slate-50 active:scale-95 transition-transform"><PlusCircle size={28}/></button>
                        <button onClick={()=>setTab('finance')} className={`p-2 rounded-xl flex flex-col items-center transition-all ${tab==='finance'?'text-indigo-600 bg-indigo-50':'text-slate-400'}`}><PieChart size={24}/><span className="text-[10px] font-bold mt-1">Umsatz</span></button>
                        <button onClick={()=>setTab('profile')} className={`p-2 rounded-xl flex flex-col items-center transition-all ${tab==='profile'?'text-indigo-600 bg-indigo-50':'text-slate-400'}`}><UserCircle size={24}/><span className="text-[10px] font-bold mt-1">Konto</span></button>
                    </div>
                </nav>
            );
        };

        // --- HAUPT APP LOGIK ---
        function App() {
            const [tab, setTab] = useState('profile');
            const [user, setUser] = useState(null);
            const [data, setData] = useState([]);
            const [toast, setToast] = useState(null);
            const [delId, setDelId] = useState(null);
            const initRef = useRef(true);

            // Startup Check
            useEffect(() => {
                const u = localStorage.getItem('ee_user');
                if(u) { setUser(JSON.parse(u)); setTab('dashboard'); }
                setTimeout(() => document.getElementById('loader').style.display='none', 800);
            }, []);

            // Firebase Sync + Notification Logic
            useEffect(() => {
                const q = query(collection(db, COL_NAME), orderBy("date", "desc"));
                const unsub = onSnapshot(q, (snap) => {
                    const items = snap.docs.map(d => ({id:d.id, ...d.data()}));
                    setData(items);

                    // Benachrichtigung
                    if(!initRef.current && user) {
                        snap.docChanges().forEach(change => {
                            if(change.type === 'added') {
                                const job = change.doc.data();
                                if(job.assignee !== user.name && Notification.permission === 'granted') {
                                    try { new Notification("Neuer Auftrag!", { body: `${job.revenue}€ - ${job.contact}` }); } catch(e){}
                                }
                            }
                        });
                    }
                    initRef.current = false;
                });
                return () => unsub();
            }, [user]);

            const login = (n) => { const u = {name:n}; setUser(u); localStorage.setItem('ee_user', JSON.stringify(u)); setTab('dashboard'); setToast({msg:`Hallo ${n}!`, type:'success'}); };
            const logout = () => { setUser(null); localStorage.removeItem('ee_user'); setTab('profile'); };
            
            const delReq = (id) => setDelId(id);
            const delConf = async () => { if(delId) { await deleteDoc(doc(db, COL_NAME, delId)); setDelId(null); setToast({msg:"Gelöscht", type:'success'}); } };
            const toggle = async (id, stat) => { await updateDoc(doc(db, COL_NAME, id), {status: stat==='completed'?'open':'completed'}); };
            const add = () => { setTab('dashboard'); setToast({msg:"Gespeichert!", type:'success'}); };

            // Stats Calculation
            const stats = useMemo(() => {
                const now = new Date();
                const m = now.getMonth(), y = now.getFullYear();
                const open = data.filter(d=>d.status!=='completed').length;
                const done = data.filter(d=>d.status==='completed').length;
                const revM = data.filter(d => { const x=new Date(d.date); return x.getMonth()===m && x.getFullYear()===y }).reduce((a,b)=>a+(b.revenue||0),0);
                const revY = data.filter(d => new Date(d.date).getFullYear()===y).reduce((a,b)=>a+(b.revenue||0),0);
                const next = data.filter(d => d.status!=='completed' && new Date(d.date) >= new Date().setHours(0,0,0,0)).sort((a,b)=>new Date(a.date)-new Date(b.date)).slice(0,3);
                return { openCount: open, completedCount: done, revenueMonth: revM, revenueYear: revY, nextThree: next };
            }, [data]);

            // History Data
            const history = useMemo(() => {
                const g = {};
                data.forEach(d => {
                    const x = new Date(d.date); const k = `${x.getFullYear()}-${x.getMonth()}`;
                    if(!g[k]) g[k] = { monthName: x.toLocaleDateString('de-DE',{month:'long', year:'numeric'}), revenue:0, count:0, s: x.getTime() };
                    g[k].revenue += d.revenue||0; g[k].count++;
                });
                return Object.values(g).sort((a,b)=>b.s-a.s);
            }, [data]);

            return (
                <>
                    {toast && <Toast message={toast.msg} type={toast.type} onClose={()=>setToast(null)}/>}
                    <ConfirmModal isOpen={!!delId} title="Löschen?" message="Bist du sicher?" onConfirm={delConf} onCancel={()=>setDelId(null)}/>
                    
                    <main className="container mx-auto px-4 py-6 md:max-w-2xl">
                        {!user && <ProfileView onLogin={login}/>}
                        {user && tab === 'dashboard' && <DashboardView stats={stats} onDeleteRequest={delReq} onToggleStatus={toggle}/>}
                        {user && tab === 'list' && <ListView bookings={data} onDeleteRequest={delReq} onToggleStatus={toggle}/>}
                        {user && tab === 'add' && <AddFormView onAdd={add} onCancel={()=>setTab('dashboard')} currentUser={user}/>}
                        {user && tab === 'finance' && <FinancialView stats={stats} historyData={history}/>}
                        {user && tab === 'profile' && <ProfileView currentUser={user} onLogout={logout}/>}
                    </main>
                    
                    <Navbar tab={tab} setTab={setTab} user={user}/>
                </>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
