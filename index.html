<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ElegantEvent Manager</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        slate: {
                            850: '#1e293b', // Custom dark shade
                            900: '#0f172a',
                        }
                    }
                }
            }
        }
    </script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        @keyframes bounceIn { 0% { transform: scale(0.9); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
        @keyframes fadeIn { 0% { opacity: 0; } 100% { opacity: 1; } }
        .animate-bounce-in { animation: bounceIn 0.3s cubic-bezier(0.18, 0.89, 0.32, 1.28) forwards; }
        .animate-fade-in { animation: fadeIn 0.4s ease-out forwards; }
        .pb-safe { padding-bottom: env(safe-area-inset-bottom); }
        body { -webkit-tap-highlight-color: transparent; }
        
        /* Scrollbar styling for dark mode */
        .dark ::-webkit-scrollbar { width: 8px; }
        .dark ::-webkit-scrollbar-track { background: #1e293b; }
        .dark ::-webkit-scrollbar-thumb { background: #475569; border-radius: 4px; }
        .dark ::-webkit-scrollbar-thumb:hover { background: #64748b; }
    </style>
</head>
<body class="bg-slate-50 dark:bg-slate-900 transition-colors duration-300">
    <div id="root"></div>

    <script type="text/babel" data-type="module">
        import React, { useState, useEffect, useMemo } from 'https://esm.sh/react@18.2.0';
        import ReactDOM from 'https://esm.sh/react-dom@18.2.0/client';
        import { 
            LayoutDashboard, List, PlusCircle, MapPin, Calendar, DollarSign, Trash2,
            TrendingUp, Clock, CheckCircle, AlertCircle, CheckSquare, UserCheck,
            Archive, History, PieChart, Phone, Navigation, BarChart3, UserCircle,
            LogOut, Lock, UserPlus, LogIn, Loader2, CloudOff, Sparkles, Cloud,
            Moon, Sun, X, Hourglass, ArrowRight, PartyPopper, User, CreditCard, Coins, Pencil, Save
        } from 'https://esm.sh/lucide-react@0.292.0';

        // --- FIREBASE IMPORTE ---
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { 
            getFirestore, collection, addDoc, onSnapshot, 
            query, orderBy, doc, deleteDoc, updateDoc, serverTimestamp,
            getDocs
        } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
        import { 
            getAuth, signInAnonymously, onAuthStateChanged, signInWithCustomToken 
        } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";

        // --- FIREBASE SETUP ---
        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {
            apiKey: "AIzaSyAugljddmPLH4QAKy2X2AaiOG4qp9IQg8c", 
            authDomain: "elegantevent-27d55.firebaseapp.com",
            projectId: "elegantevent-27d55",
            storageBucket: "elegantevent-27d55.firebasestorage.app",
            messagingSenderId: "13045694360",
            appId: "1:13045694360:web:b05d85ed441e9895c3f5ed",
            measurementId: "G-V9JERJCHXR"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'elegantevent-default';
        const COL_NAME = "auftraege"; 

        // --- KONSTANTEN ---
        const MASCOTS = ["Chase (Paw Patrol)", "Marshall (Paw Patrol)", "Skye (Paw Patrol)", "Sonic", "Stitch", "Micky Maus", "Minnie Maus", "Mario", "Luigi", "Mascha", "Der Bär", "Spiderman"];
        const EVENT_TYPES = ["Geburtstag", "Firmenfeier", "Hochzeit", "Stadtfest", "Promotion", "Kindergarten/Schule", "Sonstiges"];
        const TEAM_CODE = "maskottchen"; 
        const SEMIH_CODE = "Semih2005"; 
        const apiKey = ""; 

        // --- HILFSFUNKTIONEN ---
        const formatCurrency = (amount) => new Intl.NumberFormat('de-DE', { style: 'currency', currency: 'EUR' }).format(amount);
        const formatDate = (dateString) => {
            if (!dateString) return 'Ungültiges Datum';
            const options = { weekday: 'short', year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' };
            return new Date(dateString).toLocaleDateString('de-DE', options);
        };
        const getMonthName = (dateString) => {
            if (!dateString) return '';
            return new Date(dateString).toLocaleDateString('de-DE', { month: 'long', year: 'numeric' });
        };
        const calculateEndTime = (startTime, duration) => {
            if (!startTime || !duration) return '';
            const [h, m] = startTime.split(':').map(Number);
            const totalMinutes = h * 60 + m + (parseFloat(duration) * 60);
            const newH = Math.floor(totalMinutes / 60) % 24;
            const newM = Math.floor(totalMinutes % 60);
            return `${String(newH).padStart(2, '0')}:${String(newM).padStart(2, '0')}`;
        };

        // --- KOMPONENTEN ---
        const Toast = ({ message, type = 'success', onClose }) => {
            useEffect(() => { const timer = setTimeout(onClose, 3000); return () => clearTimeout(timer); }, [onClose]);
            return (
                <div className={`fixed top-24 right-5 px-6 py-4 rounded-xl shadow-2xl z-[100] flex items-center space-x-3 animate-bounce-in border ${type === 'success' ? 'bg-white border-green-500 text-green-700' : 'bg-white border-red-500 text-red-700'}`}>
                    {type === 'success' ? <CheckCircle size={24} /> : <AlertCircle size={24} />}
                    <span className="font-bold text-base">{message}</span>
                </div>
            );
        };

        const ConfirmModal = ({ isOpen, title, message, onConfirm, onCancel }) => {
            if (!isOpen) return null;
            return (
                <div className="fixed inset-0 z-[200] flex items-center justify-center bg-black/60 backdrop-blur-sm p-4 animate-fade-in">
                    <div className="bg-white dark:bg-slate-800 rounded-2xl shadow-2xl w-full max-w-md overflow-hidden transform transition-all scale-100 border dark:border-slate-700">
                        <div className="p-8">
                            <h3 className="text-2xl font-bold text-slate-800 dark:text-white mb-3">{title}</h3>
                            <p className="text-slate-600 dark:text-slate-300 text-lg leading-relaxed">{message}</p>
                        </div>
                        <div className="bg-slate-50 dark:bg-slate-850 px-8 py-5 flex space-x-4 justify-end border-t border-slate-100 dark:border-slate-700">
                            <button onClick={onCancel} className="px-6 py-3 rounded-xl text-slate-600 dark:text-slate-300 font-bold hover:bg-slate-200 dark:hover:bg-slate-700 transition-colors">Abbrechen</button>
                            <button onClick={onConfirm} className="px-6 py-3 rounded-xl bg-red-600 text-white font-bold hover:bg-red-700 shadow-lg transition-colors">Löschen</button>
                        </div>
                    </div>
                </div>
            );
        };

        const MonthDetailModal = ({ isOpen, monthName, bookings, onClose }) => {
            if (!isOpen) return null;
            const monthBookings = bookings.filter(b => 
                b.status === 'completed' && getMonthName(b.date) === monthName
            ).sort((a, b) => new Date(b.date) - new Date(a.date));

            return (
                <div className="fixed inset-0 z-[200] flex items-center justify-center bg-black/60 backdrop-blur-sm p-4 animate-fade-in">
                    <div className="bg-slate-50 dark:bg-slate-900 rounded-3xl shadow-2xl w-full max-w-2xl h-[80vh] flex flex-col overflow-hidden transform transition-all scale-100 border dark:border-slate-700">
                        <div className="p-6 bg-white dark:bg-slate-800 border-b dark:border-slate-700 flex justify-between items-center shrink-0">
                            <div className="flex items-center space-x-3">
                                <div className="bg-emerald-100 dark:bg-emerald-900/30 p-2.5 rounded-xl text-emerald-700 dark:text-emerald-400">
                                    <CheckCircle size={24} />
                                </div>
                                <div>
                                    <h3 className="text-xl font-bold text-slate-800 dark:text-white">Erledigte Aufträge</h3>
                                    <p className="text-slate-500 dark:text-slate-400 font-medium">{monthName}</p>
                                </div>
                            </div>
                            <button onClick={onClose} className="p-2 bg-slate-100 dark:bg-slate-700 rounded-full hover:bg-slate-200 dark:hover:bg-slate-600 transition-colors text-slate-600 dark:text-slate-300">
                                <X size={20} />
                            </button>
                        </div>
                        
                        <div className="flex-1 overflow-y-auto p-6 space-y-4">
                            {monthBookings.length > 0 ? (
                                monthBookings.map(booking => (
                                    <BookingCard key={booking.id} booking={booking} readonly={true} />
                                ))
                            ) : (
                                <div className="flex flex-col items-center justify-center h-full text-slate-400 dark:text-slate-500">
                                    <History size={48} className="mb-4 opacity-50" />
                                    <p>Keine abgeschlossenen Aufträge in diesem Monat.</p>
                                </div>
                            )}
                        </div>
                        
                        <div className="p-4 bg-white dark:bg-slate-800 border-t dark:border-slate-700 shrink-0 flex justify-between items-center text-sm font-bold text-slate-500 dark:text-slate-400">
                            <span>Gesamt: {monthBookings.length} Aufträge</span>
                            <span>Umsatz: {formatCurrency(monthBookings.reduce((sum, b) => sum + Number(b.revenue), 0))}</span>
                        </div>
                    </div>
                </div>
            );
        };

        const BookingCard = ({ booking, onDeleteRequest, onToggleStatus, onEditRequest, readonly = false }) => {
            const isCompleted = booking.status === 'completed';
            const isPastDate = new Date(booking.date) < new Date();
            const mascotList = Array.isArray(booking.mascot) ? booking.mascot : [booking.mascot];
            const cleanNumber = booking.contact ? booking.contact.replace(/[^0-9+]/g, '') : '';
            const phoneLink = cleanNumber.length > 3 ? `tel:${cleanNumber}` : null;
            
            const endTime = booking.duration ? calculateEndTime(booking.date.split('T')[1], booking.duration) : null;
            const timeDisplay = endTime ? `${booking.date.split('T')[1].slice(0,5)} - ${endTime}` : booking.date.split('T')[1].slice(0,5);

            const paymentStatus = booking.paymentStatus || 'open';
            const paymentConfig = {
                'open': { icon: DollarSign, color: 'text-slate-400 dark:text-slate-500', bg: 'bg-slate-100 dark:bg-slate-700' },
                'deposit': { icon: Coins, color: 'text-amber-500', bg: 'bg-amber-100 dark:bg-amber-900/30' },
                'paid': { icon: CheckCircle, color: 'text-emerald-500', bg: 'bg-emerald-100 dark:bg-emerald-900/30' }
            };
            const pStatus = paymentConfig[paymentStatus] || paymentConfig['open'];

            return (
                <div className={`group rounded-2xl border border-slate-100 dark:border-slate-700 p-5 relative transition-all duration-300 hover:-translate-y-1 hover:shadow-xl bg-white dark:bg-slate-800 ${isCompleted ? 'bg-slate-50/50 dark:bg-slate-800/50' : ''}`}>
                    <div className={`absolute left-0 top-6 bottom-6 w-1 rounded-r-full ${isCompleted ? 'bg-green-500' : isPastDate ? 'bg-slate-300 dark:bg-slate-600' : 'bg-indigo-500'}`}></div>
                    <div className="pl-3">
                        <div className="flex justify-between items-start mb-3">
                            <div className="flex flex-col items-start gap-2">
                                <div className="flex flex-wrap gap-2">
                                    {mascotList.map((m, idx) => (
                                        <span key={idx} className={`px-2.5 py-1 rounded-lg text-xs font-bold uppercase tracking-wider border ${isCompleted ? 'bg-green-100 text-green-700 border-green-200 dark:bg-green-900/30 dark:text-green-400 dark:border-green-800' : 'bg-indigo-50 text-indigo-700 border-indigo-100 dark:bg-indigo-900/30 dark:text-indigo-300 dark:border-indigo-800'}`}>{m}</span>
                                    ))}
                                    {booking.eventType && (
                                        <span className="px-2.5 py-1 rounded-lg text-xs font-bold bg-purple-50 text-purple-700 border border-purple-100 dark:bg-purple-900/30 dark:text-purple-300 dark:border-purple-800 flex items-center">
                                            <PartyPopper size={12} className="mr-1"/> {booking.eventType}
                                        </span>
                                    )}
                                </div>
                                {booking.customerName && (
                                    <h4 className="font-bold text-slate-800 dark:text-slate-100 flex items-center text-sm">
                                        <User size={14} className="mr-1.5 text-slate-400"/> {booking.customerName}
                                    </h4>
                                )}
                            </div>
                            
                            {!readonly && (
                                <div className="flex space-x-1 opacity-100 md:opacity-0 md:group-hover:opacity-100 transition-opacity"> 
                                    <button onClick={(e) => { e.stopPropagation(); onToggleStatus(booking.id, booking.status); }} className={`p-2 rounded-lg transition-colors ${isCompleted ? 'bg-green-100 text-green-600 dark:bg-green-900/40 dark:text-green-400' : 'bg-slate-100 text-slate-400 hover:text-green-600 hover:bg-green-50 dark:bg-slate-700 dark:text-slate-400 dark:hover:text-green-400 dark:hover:bg-slate-600'}`}>
                                        <CheckSquare size={18} />
                                    </button>
                                    <button onClick={(e) => { e.stopPropagation(); onEditRequest(booking); }} className="p-2 rounded-lg bg-blue-50 text-blue-400 hover:bg-blue-100 hover:text-blue-600 transition-colors dark:bg-blue-900/20 dark:hover:bg-blue-900/40">
                                        <Pencil size={18} />
                                    </button>
                                    <button onClick={(e) => { e.stopPropagation(); onDeleteRequest(booking.id); }} className="p-2 rounded-lg bg-red-50 text-red-400 hover:bg-red-100 hover:text-red-600 transition-colors dark:bg-red-900/20 dark:hover:bg-red-900/40">
                                        <Trash2 size={18} />
                                    </button>
                                </div>
                            )}
                        </div>
                        <div className="space-y-2 mb-4">
                            <h3 className={`text-lg font-bold flex items-center ${isCompleted ? 'text-green-800 dark:text-green-400' : 'text-slate-800 dark:text-white'}`}>
                                <Calendar size={18} className={`mr-2.5 ${isCompleted ? 'text-green-500' : 'text-indigo-500 dark:text-indigo-400'}`} /> 
                                <span className="mr-2">{new Date(booking.date).toLocaleDateString('de-DE', { weekday: 'short', year: 'numeric', month: '2-digit', day: '2-digit' })}</span>
                                <span className="text-slate-400 font-normal text-base flex items-center"><Clock size={14} className="mr-1 ml-2"/> {timeDisplay}</span>
                            </h3>
                            <div className="flex items-start">
                                <MapPin size={18} className={`mr-2.5 mt-1 shrink-0 ${isCompleted ? 'text-green-500' : 'text-red-500'}`} />
                                <a href={`https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(booking.location)}`} target="_blank" className="text-base text-slate-700 dark:text-slate-300 hover:text-indigo-600 dark:hover:text-indigo-400 hover:underline font-medium">{booking.location} <Navigation size={12} className="ml-1 inline-block text-indigo-400" /></a>
                            </div>
                            {booking.contact && (
                                <div className="flex items-center text-slate-600 dark:text-slate-400 ml-0.5">
                                    <Phone size={16} className={`mr-3 ${isCompleted ? 'text-green-500' : 'text-indigo-500 dark:text-indigo-400'}`} />
                                    {phoneLink ? <a href={phoneLink} onClick={(e) => e.stopPropagation()} className="text-base font-bold text-slate-700 dark:text-slate-300 hover:text-indigo-600 underline">{booking.contact}</a> : <span className="text-base font-medium text-slate-700 dark:text-slate-300">{booking.contact}</span>}
                                </div>
                            )}
                        </div>
                        <div className="pt-4 border-t border-slate-100 dark:border-slate-700 flex justify-between items-center">
                            <div className="text-sm text-slate-500 dark:text-slate-400 italic truncate max-w-[50%] flex items-center">
                                {booking.notes && booking.notes.includes("AI-Vorschlag") && <Sparkles size={12} className="mr-1 text-purple-500" />} {booking.notes || "Keine Notizen"}
                            </div>
                            <div className="flex items-center space-x-2">
                                <div className={`p-1.5 rounded-lg ${pStatus.bg}`} title={paymentStatus}>
                                    <pStatus.icon size={16} className={pStatus.color} />
                                </div>
                                <span className={`text-lg font-bold px-3 py-1 rounded-lg ${isCompleted ? 'bg-green-50 text-green-700 dark:bg-green-900/30 dark:text-green-400' : 'bg-slate-50 text-slate-900 dark:bg-slate-700 dark:text-white'}`}>{formatCurrency(booking.revenue)}</span>
                            </div>
                        </div>
                        {booking.assignee && (
                             <div className="absolute top-5 right-12 md:right-16 md:static md:mt-2 md:flex md:justify-end">
                                <span className="flex items-center text-xs font-bold text-slate-500 dark:text-slate-400 bg-slate-50 dark:bg-slate-800/50 px-2 py-1 rounded border border-slate-100 dark:border-slate-700">
                                    <UserCheck size={12} className="mr-1"/> {booking.assignee}
                                </span>
                             </div>
                        )}
                    </div>
                </div>
            );
        };

        const HistoryRow = ({ month, revenue, count, onClick }) => (
            <div onClick={onClick} className="cursor-pointer group flex justify-between items-center bg-white dark:bg-slate-800 p-4 rounded-xl border border-slate-100 dark:border-slate-700 hover:border-emerald-200 dark:hover:border-emerald-700/50 hover:shadow-md transition-all shadow-sm">
                <div className="flex items-center space-x-4">
                    <div className="bg-emerald-100 dark:bg-emerald-900/30 p-3 rounded-xl text-emerald-700 dark:text-emerald-400 group-hover:scale-110 transition-transform"><History size={20} /></div>
                    <div>
                        <span className="block font-bold text-slate-800 dark:text-slate-100 text-lg">{month}</span>
                        <span className="text-sm text-slate-500 dark:text-slate-400">{count} Aufträge</span>
                    </div>
                </div>
                <div className="flex items-center">
                    <p className="text-xl font-bold text-emerald-700 dark:text-emerald-400 bg-emerald-50 dark:bg-emerald-900/10 px-4 py-2 rounded-lg">{formatCurrency(revenue)}</p>
                    <div className="ml-3 text-slate-300 dark:text-slate-600 opacity-0 group-hover:opacity-100 transition-opacity">
                        <List size={20} />
                    </div>
                </div>
            </div>
        );

        // --- VIEWS ---
        const DashboardView = ({ stats, onDeleteRequest, onToggleStatus, onEditRequest }) => (
            <div className="space-y-8 animate-fade-in">
                <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div className="bg-white dark:bg-slate-800 p-6 rounded-3xl border border-slate-100 dark:border-slate-700 shadow-sm flex flex-col relative overflow-hidden group hover:shadow-md transition-shadow">
                        <div className="absolute right-0 top-0 p-6 opacity-5 dark:opacity-10 group-hover:opacity-10 transition-opacity"><Clock size={100} className="dark:text-white"/></div>
                        <span className="text-sm font-bold uppercase tracking-wider text-slate-500 dark:text-slate-400 mb-2 flex items-center"><Clock size={16} className="mr-2 text-indigo-500 dark:text-indigo-400"/> Offene Jobs</span>
                        <span className="text-5xl font-extrabold text-slate-800 dark:text-white">{stats.openCount}</span>
                    </div>
                    <div className="bg-white dark:bg-slate-800 p-6 rounded-3xl border border-slate-100 dark:border-slate-700 shadow-sm flex flex-col relative overflow-hidden group hover:shadow-md transition-shadow">
                        <div className="absolute right-0 top-0 p-6 opacity-5 dark:opacity-10 group-hover:opacity-10 transition-opacity"><CheckCircle size={100} className="dark:text-white"/></div>
                        <span className="text-sm font-bold uppercase tracking-wider text-slate-500 dark:text-slate-400 mb-2 flex items-center"><CheckCircle size={16} className="mr-2 text-emerald-500 dark:text-emerald-400"/> Erledigt</span>
                        <span className="text-5xl font-extrabold text-slate-800 dark:text-white">{stats.completedCount}</span>
                    </div>
                </div>
                <div>
                    <h2 className="text-2xl font-bold text-slate-800 dark:text-white flex items-center mb-6"><Clock className="mr-3 text-indigo-600 dark:text-indigo-400" size={28}/> Nächste Termine</h2>
                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                        {stats.nextThree.length > 0 ? (
                            stats.nextThree.map(booking => <BookingCard key={booking.id} booking={booking} onDeleteRequest={onDeleteRequest} onToggleStatus={onToggleStatus} onEditRequest={onEditRequest} />)
                        ) : (
                            <div className="col-span-full p-12 text-center bg-slate-50 dark:bg-slate-800/50 rounded-3xl border-2 border-dashed border-slate-200 dark:border-slate-700"><p className="text-slate-400 dark:text-slate-500 font-medium text-lg">Aktuell keine offenen Termine anstehend.</p></div>
                        )}
                    </div>
                </div>
            </div>
        );

        const FinancialView = ({ stats, historyData, bookings }) => {
            const [selectedMonth, setSelectedMonth] = useState(null);

            return (
                <div className="space-y-8 animate-fade-in">
                    <MonthDetailModal 
                        isOpen={!!selectedMonth} 
                        monthName={selectedMonth} 
                        bookings={bookings} 
                        onClose={() => setSelectedMonth(null)} 
                    />

                    <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
                        <div className="bg-gradient-to-br from-indigo-600 to-violet-700 p-8 rounded-3xl text-white shadow-xl relative overflow-hidden">
                            <div className="absolute right-0 bottom-0 p-0 opacity-10 translate-x-10 translate-y-10"><DollarSign size={200}/></div>
                            <div className="flex items-center space-x-3 mb-4 opacity-90"><div className="p-2 bg-white/20 rounded-lg"><DollarSign size={24} /></div><span className="text-sm font-bold uppercase tracking-widest">Umsatz (Dieser Monat)</span></div>
                            <p className="text-6xl font-extrabold tracking-tight">{formatCurrency(stats.revenueMonth)}</p>
                        </div>
                        <div className="bg-gradient-to-br from-emerald-600 to-teal-700 p-8 rounded-3xl text-white shadow-xl relative overflow-hidden">
                            <div className="absolute right-0 top-0 p-6 opacity-10"><BarChart3 size={150}/></div>
                            <div className="flex items-center space-x-3 mb-4 opacity-90"><div className="p-2 bg-white/20 rounded-lg"><TrendingUp size={24} /></div><span className="text-sm font-bold uppercase tracking-widest">Gesamtumsatz (Jahr)</span></div>
                            <p className="text-6xl font-extrabold tracking-tight relative z-10">{formatCurrency(stats.revenueYear)}</p>
                        </div>
                    </div>
                    <div className="bg-white dark:bg-slate-800 p-8 rounded-3xl border border-slate-100 dark:border-slate-700 shadow-sm">
                        <h2 className="text-2xl font-bold text-slate-800 dark:text-white flex items-center mb-6"><History className="mr-3 text-emerald-600 dark:text-emerald-400" size={28}/> Monats-Rückblick <span className="text-sm font-normal text-slate-400 ml-4 hidden md:inline">(Klicken für Details)</span></h2>
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                            {historyData.length > 0 ? historyData.map((data, idx) => (
                                <HistoryRow 
                                    key={idx} 
                                    month={data.monthName} 
                                    revenue={data.revenue} 
                                    count={data.count} 
                                    onClick={() => setSelectedMonth(data.monthName)}
                                />
                            )) : <div className="col-span-full p-8 text-center"><p className="text-slate-400 dark:text-slate-500 italic text-lg">Noch keine historischen Daten verfügbar.</p></div>}
                        </div>
                    </div>
                </div>
            );
        };

        const ListView = ({ bookings, onDeleteRequest, onToggleStatus, onEditRequest }) => {
            const [listType, setListType] = useState('open');

                if (filterMascot === 'Alle') return true;

                setIsGenerating(true);
                try {
                    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ contents: [{ parts: [{ text: `Erstelle einen kurzen Ablaufplan für: Maskottchen ${selectedMascots.join(', ')}, Event: ${formData.eventType}, ${formData.date} ${formData.time} Uhr, Dauer ${formData.duration} Std, ${formData.location}. Sprache: Deutsch.` }] }] }) });

            const [mode, setMode] = useState('login'); 
            const [formData, setFormData] = useState({ name: '', code: '' });
            const [error, setError] = useState('');

            const handleSubmit = (e) => {
                e.preventDefault();
                const name = formData.name.trim();
                const code = formData.code;
                let valid = (code === TEAM_CODE || (name.toLowerCase() === 'semih' && code === SEMIH_CODE));

                    <div className="flex items-center space-x-3 cursor-pointer" onClick={() => setActiveTab('dashboard')}>
                        <div className="w-10 h-10 bg-indigo-600 rounded-xl flex items-center justify-center shadow-lg"><span className="text-2xl">🎭</span></div>
                        <div><h1 className="text-xl font-extrabold text-slate-900 dark:text-white leading-none">ElegantEvent</h1><p className="text-xs text-indigo-600 dark:text-indigo-400 font-bold uppercase">Management</p></div>
                    </div>
                    {currentUser && (
                        <div className="hidden md:flex items-center space-x-2 bg-slate-50 dark:bg-slate-700 p-1.5 rounded-2xl border dark:border-slate-600">
                            {[ {id:'dashboard',icon:LayoutDashboard,l:'Dashboard'}, {id:'list',icon:List,l:'Liste'}, {id:'finance',icon:PieChart,l:'Finanzen'} ].map(i => 
                                <button key={i.id} onClick={()=>setActiveTab(i.id)} className={`flex items-center px-5 py-2.5 rounded-xl text-sm font-bold ${activeTab===i.id?'bg-white dark:bg-slate-600 dark:text-white text-indigo-600 shadow-sm':'text-slate-500 dark:text-slate-300'}`}><i.icon size={18} className="mr-2"/>{i.l}</button>
                            )}
                        </div>
                    )}
                    <div className="flex items-center space-x-4">
                        <button onClick={toggleDarkMode} className="p-2.5 rounded-xl bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-slate-600 transition-colors">
                            {darkMode ? <Sun size={20} /> : <Moon size={20} />}
                        </button>
                        {currentUser && <button onClick={() => setActiveTab('add')} className="hidden md:flex items-center px-6 py-3 bg-indigo-600 text-white rounded-xl font-bold shadow-lg"><PlusCircle size={20} className="mr-2" /> Neu</button>}
                        {currentUser ? <button onClick={() => setActiveTab('profile')} className="flex items-center space-x-3 px-3 py-2 bg-slate-50 dark:bg-slate-700 rounded-xl"><span className="text-sm font-bold dark:text-slate-200">{currentUser.name}</span><div className="w-8 h-8 bg-indigo-100 dark:bg-indigo-900/50 rounded-full flex items-center justify-center text-indigo-700 dark:text-indigo-400 font-bold">{currentUser.name[0]}</div></button> : <span className="text-sm font-bold text-slate-400"><Lock size={16} className="inline mr-1"/> Login</span>}
                    </div>
                </div>
                {currentUser && (
                    <div className="md:hidden fixed bottom-0 left-0 w-full bg-white dark:bg-slate-800 border-t dark:border-slate-700 pb-safe z-50 px-6 py-3 flex justify-between shadow-2xl">
                         <button onClick={()=>setActiveTab('dashboard')} className={`flex flex-col items-center ${activeTab==='dashboard'?'text-indigo-600 dark:text-indigo-400':'text-slate-400 dark:text-slate-500'}`}><LayoutDashboard size={24}/></button>
                         <button onClick={()=>setActiveTab('list')} className={`flex flex-col items-center ${activeTab==='list'?'text-indigo-600 dark:text-indigo-400':'text-slate-400 dark:text-slate-500'}`}><List size={24}/></button>
                         <button onClick={()=>setActiveTab('add')} className="relative -top-6 bg-indigo-600 text-white p-4 rounded-full shadow-lg border-4 border-slate-50 dark:border-slate-800"><PlusCircle size={28}/></button>
                         <button onClick={()=>setActiveTab('finance')} className={`flex flex-col items-center ${activeTab==='finance'?'text-indigo-600 dark:text-indigo-400':'text-slate-400 dark:text-slate-500'}`}><PieChart size={24}/></button>
                         <button onClick={()=>setActiveTab('profile')} className={`flex flex-col items-center ${activeTab==='profile'?'text-indigo-600 dark:text-indigo-400':'text-slate-400 dark:text-slate-500'}`}><UserCircle size={24}/></button>
                    </div>
                )}
            </nav>
        );

        function MascotApp() {
            const [activeTab, setActiveTab] = useState('profile');
            const [bookings, setBookings] = useState([]);
            const [currentUser, setCurrentUser] = useState(null); 
            const [isLoaded, setIsLoaded] = useState(false);
            const [toast, setToast] = useState(null);
            const [deleteModalOpen, setDeleteModalOpen] = useState(false);
            const [itemToDelete, setItemToDelete] = useState(null);
            const [user, setUser] = useState(null);
            const [editingBooking, setEditingBooking] = useState(null); // State for editing
            
            // Dark Mode State
            const [darkMode, setDarkMode] = useState(() => {
                return localStorage.getItem('theme') === 'dark';
            });

            // Dark Mode Effect
            useEffect(() => {
                if (darkMode) {
                    document.documentElement.classList.add('dark');
                    localStorage.setItem('theme', 'dark');
                } else {
                    document.documentElement.classList.remove('dark');
                    localStorage.setItem('theme', 'light');
                }
            }, [darkMode]);

            // --- AUTHENTIFIZIERUNG FÜR DB ZUGRIFF ---
            useEffect(() => {
                const initAuth = async () => {
                    if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                        await signInWithCustomToken(auth, __initial_auth_token);
                    } else {
                        await signInAnonymously(auth);
                    }
                };
                initAuth();
                const unsubscribe = onAuthStateChanged(auth, setUser);
                return () => unsubscribe();
            }, []);

            // --- FIREBASE SYNC (ECHTZEIT!) ---
            useEffect(() => {
                if (!user) return; 

                const publicCollection = collection(db, 'artifacts', appId, 'public', 'data', COL_NAME);
                const q = query(publicCollection);
                
                const unsubscribe = onSnapshot(q, (snapshot) => {
                    const jobs = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                    jobs.sort((a, b) => new Date(b.date) - new Date(a.date));
                    setBookings(jobs);
                    setIsLoaded(true);
                }, (error) => {
                    console.error("Datenbank Fehler:", error);
                    setToast({ message: "Verbindungsfehler zur Datenbank", type: "error" });
                });

                return () => unsubscribe();
            }, [user]);

            // --- AUTH LOCAL STORAGE ---
            useEffect(() => {
                const savedUser = localStorage.getItem('mascot_user');
                if (savedUser) { setCurrentUser(JSON.parse(savedUser)); setActiveTab('dashboard'); }
            }, []);

            useEffect(() => { 
                if (currentUser) localStorage.setItem('mascot_user', JSON.stringify(currentUser)); 
                else localStorage.removeItem('mascot_user'); 
            }, [currentUser]);

            // --- DATABASE ACTIONS ---
            const saveBooking = async (data, id = null) => { 
                try {
                    const publicCollection = collection(db, 'artifacts', appId, 'public', 'data', COL_NAME);
                    if (id) {
                        // Update existing
                        const docRef = doc(publicCollection, id);
                        await updateDoc(docRef, data);
                        setToast({ message: "Auftrag aktualisiert!", type: "success" });
                    } else {
                        // Create new
                        await addDoc(publicCollection, data);
                        setToast({ message: "Auftrag gespeichert!", type: "success" });
                    }
                    setActiveTab('dashboard'); 
                    setEditingBooking(null);
                } catch (e) {
                    console.error(e);
                    alert("Fehler beim Speichern: " + e.message);
                }
            };
            
            const requestDelete = (id) => { setItemToDelete(id); setDeleteModalOpen(true); };
            
            const confirmDelete = async () => { 
                if (itemToDelete && user) { 
                    const docRef = doc(db, 'artifacts', appId, 'public', 'data', COL_NAME, itemToDelete);
                    await deleteDoc(docRef);
                    setToast({ message: "Gelöscht.", type: "success" }); 
                } 
                setDeleteModalOpen(false); setItemToDelete(null); 
            };
            
            const toggleStatus = async (id, currentStatus) => { 
                if (!user) return;
                const newStatus = currentStatus === 'completed' ? 'open' : 'completed';
                const docRef = doc(db, 'artifacts', appId, 'public', 'data', COL_NAME, id);
                await updateDoc(docRef, { status: newStatus });
            };

            const handleEditRequest = (booking) => {
                setEditingBooking(booking);
                setActiveTab('add');
            };

            const handleCancelEdit = () => {
                setEditingBooking(null);
                setActiveTab('dashboard');
            };

            const handleLogin = (name) => { setCurrentUser({ name }); setActiveTab('dashboard'); };
            const handleLogout = () => { setCurrentUser(null); setActiveTab('profile'); };

            // --- STATS CALCULATION ---
            const stats = useMemo(() => {
                const now = new Date();
                const currentMonth = now.getMonth();
                const currentYear = now.getFullYear();
                const revenueMonth = bookings.filter(b => { const d = new Date(b.date); return d.getMonth() === currentMonth && d.getFullYear() === currentYear; }).reduce((sum, b) => sum + Number(b.revenue), 0);
                const revenueYear = bookings.filter(b => new Date(b.date).getFullYear() === currentYear).reduce((sum, b) => sum + Number(b.revenue), 0);
                const upcoming = bookings.filter(b => b.status !== 'completed' && new Date(b.date) > now).sort((a, b) => new Date(a.date) - new Date(b.date));
                return { revenueMonth, revenueYear, openCount: bookings.filter(b => b.status !== 'completed').length, completedCount: bookings.filter(b => b.status === 'completed').length, nextThree: upcoming.slice(0, 3) };
            }, [bookings]);

            const historyData = useMemo(() => {
                const groups = {};
                bookings.forEach(b => {
                    const d = new Date(b.date);
                    const key = `${d.getFullYear()}-${d.getMonth()}`; 
                    if (!groups[key]) groups[key] = { monthName: d.toLocaleDateString('de-DE', { month: 'long', year: 'numeric' }), revenue: 0, count: 0, sortKey: d.getTime() };
                    groups[key].revenue += Number(b.revenue); groups[key].count += 1;
                });
                return Object.values(groups).sort((a, b) => b.sortKey - a.sortKey).slice(0, 6); 
            }, [bookings]);

            return (
                <div className="min-h-screen font-sans text-slate-900 dark:text-slate-100 flex flex-col transition-colors duration-300">
                    {toast && <Toast message={toast.message} type={toast.type} onClose={() => setToast(null)} />}
                    <ConfirmModal isOpen={deleteModalOpen} title="Löschen?" message="Endgültig löschen?" onConfirm={confirmDelete} onCancel={() => setDeleteModalOpen(false)} />
                    
                    <Navbar activeTab={activeTab} setActiveTab={(tab) => { setActiveTab(tab); if(tab !== 'add') setEditingBooking(null); }} currentUser={currentUser} onLogout={handleLogout} darkMode={darkMode} toggleDarkMode={() => setDarkMode(!darkMode)} />

                    <main className="container mx-auto px-4 md:px-6 py-8 flex-1">
                        {!currentUser ? ( <ProfileView currentUser={currentUser} onLogin={handleLogin} onLogout={handleLogout} /> ) : (
                            <>
                                {activeTab === 'dashboard' && <DashboardView stats={stats} onDeleteRequest={requestDelete} onToggleStatus={toggleStatus} onEditRequest={handleEditRequest} currentUser={currentUser} />}
                                {activeTab === 'list' && <ListView bookings={bookings} onDeleteRequest={requestDelete} onToggleStatus={toggleStatus} onEditRequest={handleEditRequest} />}
                                {activeTab === 'finance' && <FinancialView stats={stats} historyData={historyData} bookings={bookings} />}
                                {activeTab === 'profile' && <ProfileView currentUser={currentUser} onLogin={handleLogin} onLogout={handleLogout} />}
                                {activeTab === 'add' && <BookingFormView onSave={saveBooking} onCancel={handleCancelEdit} currentUser={currentUser} user={user} initialData={editingBooking} />}
                            </>
                        )}
                    </main>
                    <div className="py-6 text-center text-slate-400 dark:text-slate-500 text-xs font-medium">ElegantEvent Manager v1.8 • <Cloud size={10} className="inline mr-1"/> Cloud Sync Aktiv</div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<MascotApp />);
    </script>
</body>
</html>
