<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ElegantEvent Manager</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel für JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
        
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; -webkit-tap-highlight-color: transparent; }
        .pb-safe { padding-bottom: env(safe-area-inset-bottom); }
        
        @keyframes fade-in { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade-in { animation: fade-in 0.4s ease-out forwards; }
        
        @keyframes bounce-in { 0% { transform: translate(-50%, -100%); opacity: 0; } 60% { transform: translate(-50%, 10%); opacity: 1; } 100% { transform: translate(-50%, 0); } }
        .animate-bounce-in { animation: bounce-in 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }

        /* Scrollbar hiding */
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel" data-type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
        import { getFirestore, collection, addDoc, onSnapshot, doc, updateDoc, deleteDoc, query, orderBy } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';
        import { getAuth, signInAnonymously } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js';

        // --- FIREBASE CONFIG ---
        const firebaseConfig = {
            apiKey: "AIzaSyAugljddmPLH4QAKy2X2AaiOG4qp9IQg8c",
            authDomain: "elegantevent-27d55.firebaseapp.com",
            projectId: "elegantevent-27d55",
            storageBucket: "elegantevent-27d55.firebasestorage.app",
            messagingSenderId: "13045694360",
            appId: "1:13045694360:web:b05d85ed441e9895c3f5ed",
            measurementId: "G-V9JERJCHXR"
        };

        let app, db, auth;
        try {
            app = initializeApp(firebaseConfig);
            db = getFirestore(app);
            auth = getAuth(app);
        } catch (e) {
            console.error("Firebase Init Error:", e);
        }

        const { 
            LayoutDashboard, List, PlusCircle, MapPin, Calendar, DollarSign, Trash2, 
            TrendingUp, Clock, CheckCircle, AlertCircle, CheckSquare, UserCheck, 
            Archive, History, PieChart, Phone, Navigation, BarChart3, UserCircle, 
            LogOut, Lock, UserPlus, LogIn, Loader2, CloudOff, Sparkles, Cloud, RefreshCw
        } = lucide.icons;

        const useLucide = () => {
            React.useEffect(() => {
                lucide.createIcons();
            });
        };

        const GEMINI_API_KEY = ""; 
        const MASCOTS = ["Chase (Paw Patrol)", "Marshall (Paw Patrol)", "Skye (Paw Patrol)", "Sonic", "Stitch", "Micky Maus", "Minnie Maus", "Mario", "Luigi", "Mascha", "Der Bär", "Spiderman"];
        const TEAM_CODE = "maskottchen"; 
        const SEMIH_CODE = "Semih2005"; 

        const formatCurrency = (amount) => new Intl.NumberFormat('de-DE', { style: 'currency', currency: 'EUR' }).format(amount);
        const formatDate = (dateString) => {
            if (!dateString) return 'Ungültiges Datum';
            const options = { weekday: 'short', year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' };
            return new Date(dateString).toLocaleDateString('de-DE', options);
        };
        const getMonthName = (dateString) => !dateString ? '' : new Date(dateString).toLocaleDateString('de-DE', { month: 'long', year: 'numeric' });

        const Toast = ({ message, type = 'success', onClose }) => {
            React.useEffect(() => { const timer = setTimeout(onClose, 5000); return () => clearTimeout(timer); }, [onClose]);
            return (
                <div className={`fixed top-24 right-5 px-6 py-4 rounded-xl shadow-2xl z-[100] flex items-center space-x-3 animate-bounce-in border ${type === 'success' ? 'bg-white border-green-500 text-green-700' : type === 'warning' ? 'bg-amber-50 border-amber-500 text-amber-800' : 'bg-white border-red-500 text-red-700'}`}>
                    <i data-lucide={type === 'success' ? "check-circle" : "alert-circle"} width="24" height="24"></i>
                    <span className="font-bold text-base">{message}</span>
                </div>
            );
        };

        const ConfirmModal = ({ isOpen, title, message, onConfirm, onCancel }) => {
            if (!isOpen) return null;
            return (
                <div className="fixed inset-0 z-[200] flex items-center justify-center bg-black/60 backdrop-blur-sm p-4 animate-fade-in">
                    <div className="bg-white rounded-2xl shadow-2xl w-full max-w-md overflow-hidden transform transition-all scale-100">
                        <div className="p-8">
                            <h3 className="text-2xl font-bold text-slate-800 mb-3">{title}</h3>
                            <p className="text-slate-600 text-lg leading-relaxed">{message}</p>
                        </div>
                        <div className="bg-slate-50 px-8 py-5 flex space-x-4 justify-end border-t border-slate-100">
                            <button onClick={onCancel} className="px-6 py-3 rounded-xl text-slate-600 font-bold hover:bg-slate-200 transition-colors">Abbrechen</button>
                            <button onClick={onConfirm} className="px-6 py-3 rounded-xl bg-red-600 text-white font-bold hover:bg-red-700 shadow-lg transition-colors">Löschen</button>
                        </div>
                    </div>
                </div>
            );
        };

        const BookingCard = ({ booking, onDeleteRequest, onToggleStatus }) => {
            const isCompleted = booking.status === 'completed';
            const isPastDate = new Date(booking.date) < new Date();
            const mascotList = Array.isArray(booking.mascot) ? booking.mascot : [booking.mascot];
            const cleanNumber = booking.contact ? booking.contact.replace(/[^0-9+]/g, '') : '';
            const phoneLink = cleanNumber.length > 3 ? `tel:${cleanNumber}` : null;

            return (
                <div className={`group rounded-2xl border border-slate-100 p-5 relative transition-all duration-300 hover:-translate-y-1 hover:shadow-xl bg-white ${isCompleted ? 'bg-slate-50/50' : ''}`}>
                    <div className={`absolute left-0 top-6 bottom-6 w-1 rounded-r-full ${isCompleted ? 'bg-green-500' : isPastDate ? 'bg-slate-300' : 'bg-indigo-500'}`}></div>
                    <div className="pl-3">
                        <div className="flex justify-between items-start mb-4">
                            <div className="flex flex-wrap gap-2">
                                {mascotList.map((m, idx) => (
                                    <span key={idx} className={`px-2.5 py-1 rounded-lg text-xs font-bold uppercase tracking-wider border ${isCompleted ? 'bg-green-100 text-green-700 border-green-200' : 'bg-indigo-50 text-indigo-700 border-indigo-100'}`}>{m}</span>
                                ))}
                                {booking.assignee && (
                                    <span className="flex items-center text-xs font-bold text-slate-600 bg-slate-100 px-3 py-1 rounded-lg border border-slate-200">
                                        <i data-lucide="user-check" width="14" height="14" className="mr-1.5"></i> {booking.assignee}
                                    </span>
                                )}
                            </div>
                            <div className="flex space-x-1"> 
                                <button onClick={(e) => { e.stopPropagation(); onToggleStatus(booking.id); }} className={`p-2 rounded-lg transition-colors ${isCompleted ? 'bg-green-100 text-green-600' : 'bg-slate-100 text-slate-400 hover:text-green-600 hover:bg-green-50'}`}>
                                    <i data-lucide="check-square" width="18" height="18"></i>
                                </button>
                                <button onClick={(e) => { e.stopPropagation(); onDeleteRequest(booking.id); }} className="p-2 rounded-lg bg-red-50 text-red-400 hover:bg-red-100 hover:text-red-600 transition-colors">
                                    <i data-lucide="trash-2" width="18" height="18"></i>
                                </button>
                            </div>
                        </div>
                        <div className="space-y-3 mb-4">
                            <h3 className={`text-lg font-bold flex items-center ${isCompleted ? 'text-green-800' : 'text-slate-800'}`}>
                                <i data-lucide="calendar" width="18" height="18" className={`mr-2.5 ${isCompleted ? 'text-green-500' : 'text-indigo-500'}`}></i>
                                {formatDate(booking.date)}
                            </h3>
                            <div className="flex items-start">
                                <i data-lucide="map-pin" width="18" height="18" className={`mr-2.5 mt-1 shrink-0 ${isCompleted ? 'text-green-500' : 'text-red-500'}`}></i>
                                <a href={`https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(booking.location)}`} target="_blank" rel="noopener noreferrer" onClick={(e) => e.stopPropagation()} className="text-base text-slate-700 hover:text-indigo-600 hover:underline decoration-indigo-200 underline-offset-4 font-medium leading-relaxed">
                                    {booking.location} <i data-lucide="navigation" width="12" height="12" className="ml-1 inline-block text-indigo-400"></i>
                                </a>
                            </div>
                            {booking.contact && (
                                <div className="flex items-center text-slate-600">
                                    <i data-lucide="phone" width="18" height="18" className={`mr-2.5 ${isCompleted ? 'text-green-500' : 'text-indigo-500'}`}></i>
                                    {phoneLink ? (
                                        <a href={phoneLink} onClick={(e) => e.stopPropagation()} className="text-base font-bold text-slate-700 hover:text-indigo-600 transition-colors underline decoration-slate-200 underline-offset-2">{booking.contact}</a>
                                    ) : (
                                        <span className="text-base font-medium text-slate-700">{booking.contact}</span>
                                    )}
                                </div>
                            )}
                        </div>
                        <div className="pt-4 border-t border-slate-100 flex justify-between items-center">
                            <div className="text-sm text-slate-500 italic truncate max-w-[60%] flex items-center">
                                {booking.notes && booking.notes.includes("AI-Vorschlag") && <i data-lucide="sparkles" width="12" height="12" className="mr-1 text-purple-500"></i>}
                                {booking.notes || "Keine Notizen"}
                            </div>
                            <span className={`text-lg font-bold px-3 py-1 rounded-lg ${isCompleted ? 'bg-green-50 text-green-700' : 'bg-slate-50 text-slate-900'}`}>{formatCurrency(booking.revenue)}</span>
                        </div>
                    </div>
                </div>
            );
        };

        const DashboardView = ({ stats, onDeleteRequest, onToggleStatus, currentUser }) => (
            <div className="space-y-8 animate-fade-in">
                <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div className="bg-white p-6 rounded-3xl border border-slate-100 shadow-sm flex flex-col relative overflow-hidden group hover:shadow-md transition-shadow">
                        <div className="absolute right-0 top-0 p-6 opacity-5"><i data-lucide="clock" width="100" height="100"></i></div>
                        <span className="text-sm font-bold uppercase tracking-wider text-slate-500 mb-2 flex items-center"><i data-lucide="clock" width="16" height="16" className="mr-2 text-indigo-500"></i> Offene Jobs</span>
                        <span className="text-5xl font-extrabold text-slate-800">{stats.openCount}</span>
                    </div>
                    <div className="bg-white p-6 rounded-3xl border border-slate-100 shadow-sm flex flex-col relative overflow-hidden group hover:shadow-md transition-shadow">
                        <div className="absolute right-0 top-0 p-6 opacity-5"><i data-lucide="check-circle" width="100" height="100"></i></div>
                        <span className="text-sm font-bold uppercase tracking-wider text-slate-500 mb-2 flex items-center"><i data-lucide="check-circle" width="16" height="16" className="mr-2 text-emerald-500"></i> Erledigt</span>
                        <span className="text-5xl font-extrabold text-slate-800">{stats.completedCount}</span>
                    </div>
                </div>
                <div>
                    <h2 className="text-2xl font-bold text-slate-800 flex items-center mb-6"><i data-lucide="clock" width="28" height="28" className="mr-3 text-indigo-600"></i> Nächste Termine</h2>
                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                        {stats.nextThree.length > 0 ? (
                            stats.nextThree.map(booking => <BookingCard key={booking.id} booking={booking} onDeleteRequest={onDeleteRequest} onToggleStatus={onToggleStatus} />)
                        ) : (
                            <div className="col-span-full p-12 text-center bg-slate-50 rounded-3xl border-2 border-dashed border-slate-200"><p className="text-slate-400 font-medium text-lg">Aktuell keine offenen Termine anstehend.</p></div>
                        )}
                    </div>
                </div>
            </div>
        );

        const FinancialView = ({ stats, historyData }) => (
            <div className="space-y-8 animate-fade-in">
                <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
                    <div className="bg-gradient-to-br from-indigo-600 to-violet-700 p-8 rounded-3xl text-white shadow-xl relative overflow-hidden">
                        <div className="absolute right-0 bottom-0 p-0 opacity-10 translate-x-10 translate-y-10"><i data-lucide="dollar-sign" width="200" height="200"></i></div>
                        <div className="flex items-center space-x-3 mb-4 opacity-90">
                            <div className="p-2 bg-white/20 rounded-lg"><i data-lucide="dollar-sign" width="24" height="24"></i></div>
                            <span className="text-sm font-bold uppercase tracking-widest">Umsatz (Dieser Monat)</span>
                        </div>
                        <p className="text-6xl font-extrabold tracking-tight">{formatCurrency(stats.revenueMonth)}</p>
                    </div>
                    <div className="bg-gradient-to-br from-emerald-600 to-teal-700 p-8 rounded-3xl text-white shadow-xl relative overflow-hidden">
                        <div className="absolute right-0 top-0 p-6 opacity-10"><i data-lucide="bar-chart-3" width="150" height="150"></i></div>
                        <div className="flex items-center space-x-3 mb-4 opacity-90">
                            <div className="p-2 bg-white/20 rounded-lg"><i data-lucide="trending-up" width="24" height="24"></i></div>
                            <span className="text-sm font-bold uppercase tracking-widest">Gesamtumsatz (Jahr)</span>
                        </div>
                        <p className="text-6xl font-extrabold tracking-tight relative z-10">{formatCurrency(stats.revenueYear)}</p>
                    </div>
                </div>
                <div className="bg-white p-8 rounded-3xl border border-slate-100 shadow-sm">
                    <h2 className="text-2xl font-bold text-slate-800 flex items-center mb-6"><i data-lucide="history" width="28" height="28" className="mr-3 text-emerald-600"></i> Monats-Rückblick</h2>
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                        {historyData.length > 0 ? historyData.map((data, idx) => (
                            <div key={idx} className="flex justify-between items-center bg-white p-4 rounded-xl border border-slate-100 hover:border-emerald-200 transition-all shadow-sm">
                                <div className="flex items-center space-x-4">
                                    <div className="bg-emerald-100 p-3 rounded-xl text-emerald-700"><i data-lucide="history" width="20" height="20"></i></div>
                                    <div><span className="block font-bold text-slate-800 text-lg">{data.monthName}</span><span className="text-sm text-slate-500">{data.count} Aufträge</span></div>
                                </div>
                                <p className="text-xl font-bold text-emerald-700 bg-emerald-50 px-4 py-2 rounded-lg">{formatCurrency(data.revenue)}</p>
                            </div>
                        )) : <div className="col-span-full p-8 text-center"><p className="text-slate-400 italic text-lg">Noch keine historischen Daten verfügbar.</p></div>}
                    </div>
                </div>
            </div>
        );

        const AddFormView = ({ onAdd, onCancel, currentUser }) => {
            const now = new Date();
            const [formData, setFormData] = React.useState({ date: now.toISOString().split('T')[0], time: now.toTimeString().slice(0, 5), location: '', revenue: '', assignee: currentUser ? currentUser.name : '', contact: '', notes: '' });
            const [selectedMascots, setSelectedMascots] = React.useState([]);
            const [suggestions, setSuggestions] = React.useState([]);
            const [showSuggestions, setShowSuggestions] = React.useState(false);
            const [isSearching, setIsSearching] = React.useState(false);
            const [isGenerating, setIsGenerating] = React.useState(false);

            React.useEffect(() => {
                const timer = setTimeout(async () => {
                    if (formData.location.length > 2 && showSuggestions) {
                        setIsSearching(true);
                        try {
                            const response = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(formData.location)}&countrycodes=de&limit=5`);
                            const data = await response.json();
                            setSuggestions(data);
                        } catch (error) { console.error(error); } finally { setIsSearching(false); }
                    } else { setSuggestions([]); }
                }, 500);
                return () => clearTimeout(timer);
            }, [formData.location, showSuggestions]);

            const handleAIGenerate = async () => {
                if (selectedMascots.length === 0) { alert("Bitte wähle zuerst ein Maskottchen aus!"); return; }
                if (!GEMINI_API_KEY) { alert("Kein API Key konfiguriert! Bitte füge den Key im Code ein."); return; }
                setIsGenerating(true);
                const prompt = `Erstelle einen kurzen Ablaufplan für Event: Maskottchen ${selectedMascots.join(', ')}, ${formatDate(formData.date)}, ${formData.time} Uhr, Ort ${formData.location}. Sprache: Deutsch.`;
                try {
                    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${GEMINI_API_KEY}`, {
                        method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
                    });
                    if (!response.ok) throw new Error("AI Fehler");
                    const data = await response.json();
                    setFormData(prev => ({ ...prev, notes: data.candidates[0].content.parts[0].text + "\n(AI-Vorschlag)" }));
                } catch (error) { console.error(error); alert("Fehler bei AI Generierung."); } finally { setIsGenerating(false); }
            };

            const handleSubmit = (e) => {
                e.preventDefault();
                if (!formData.date || !formData.time || !formData.revenue) return;
                if (selectedMascots.length === 0) { alert("Bitte wähle mindestens ein Maskottchen aus."); return; }
                
                const newBooking = { 
                    id: Date.now().toString(), // Lokale ID für Sofort-Update
                    date: `${formData.date}T${formData.time}`, 
                    location: formData.location || "Kein Ort", 
                    mascot: selectedMascots, 
                    revenue: parseFloat(formData.revenue), 
                    notes: formData.notes, 
                    assignee: formData.assignee, 
                    contact: formData.contact, 
                    status: 'open' 
                };
                
                onAdd(newBooking);
            };

            const setNow = () => {
                const n = new Date();
                setFormData(prev => ({ ...prev, date: n.toISOString().split('T')[0], time: n.toTimeString().slice(0, 5) }));
            };

            return (
                <div className="max-w-3xl mx-auto animate-fade-in bg-white p-8 rounded-3xl shadow-xl border border-slate-100">
                    <div className="flex justify-between items-center mb-8 pb-4 border-b border-slate-100">
                        <h2 className="text-3xl font-extrabold text-slate-800">Neuer Auftrag</h2>
                        <button type="button" onClick={setNow} className="text-xs font-bold text-indigo-600 bg-indigo-50 px-3 py-1.5 rounded-lg flex items-center hover:bg-indigo-100 transition-colors">
                            <i data-lucide="refresh-cw" width="12" height="12" className="mr-1.5"></i> Jetzt
                        </button>
                    </div>
                    <form onSubmit={handleSubmit} className="space-y-6">
                        <div className="grid grid-cols-2 gap-6">
                            <div><label className="block text-xs font-bold text-slate-500 mb-2 uppercase">Datum</label><input required type="date" className="w-full p-4 bg-slate-50 rounded-xl border border-slate-200 focus:border-indigo-500 outline-none" value={formData.date} onChange={e => setFormData(prev => ({...prev, date: e.target.value}))} /></div>
                            <div><label className="block text-xs font-bold text-slate-500 mb-2 uppercase">Uhrzeit</label><input required type="time" className="w-full p-4 bg-slate-50 rounded-xl border border-slate-200 focus:border-indigo-500 outline-none" value={formData.time} onChange={e => setFormData(prev => ({...prev, time: e.target.value}))} /></div>
                        </div>
                        <div className="relative z-50">
                            <label className="block text-xs font-bold text-slate-500 mb-2 uppercase">Ort (Suche)</label>
                            <div className="relative">
                                <i data-lucide="map-pin" className="absolute left-4 top-4 text-slate-400" width="20" height="20"></i>
                                <input required type="text" placeholder="Adresse..." className="w-full p-4 pl-12 bg-slate-50 rounded-xl border border-slate-200 focus:border-indigo-500 outline-none" value={formData.location} onChange={(e) => { setFormData(prev => ({...prev, location: e.target.value})); setShowSuggestions(true); }} onFocus={() => setShowSuggestions(true)} />
                                {isSearching && <div className="absolute right-4 top-4 animate-spin text-indigo-500"><i data-lucide="loader-2" width="20" height="20"></i></div>}
                            </div>
                            {showSuggestions && suggestions.length > 0 && (
                                <div className="absolute top-full left-0 w-full bg-white rounded-xl shadow-2xl mt-2 max-h-60 overflow-y-auto z-50">
                                    {suggestions.map((s, i) => (
                                        <button key={i} type="button" className="w-full text-left p-4 hover:bg-indigo-50 text-sm border-b border-slate-50 flex items-center" onClick={() => { setFormData(prev => ({...prev, location: s.display_name})); setShowSuggestions(false); }}>
                                            <i data-lucide="map-pin" width="16" height="16" className="mr-3 text-indigo-400"></i><span className="truncate">{s.display_name}</span>
                                        </button>
                                    ))}
                                </div>
                            )}
                        </div>
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                            <div><label className="block text-xs font-bold text-slate-500 mb-2 uppercase">Kontakt</label><div className="relative"><i data-lucide="phone" className="absolute left-4 top-4 text-slate-400" width="20" height="20"></i><input type="text" placeholder="Name & Tel" className="w-full p-4 pl-12 bg-slate-50 rounded-xl border border-slate-200 outline-none" value={formData.contact} onChange={e => setFormData(prev => ({...prev, contact: e.target.value}))} /></div></div>
                            <div><label className="block text-xs font-bold text-slate-500 mb-2 uppercase">Umsatz (€)</label><div className="relative"><i data-lucide="dollar-sign" className="absolute left-4 top-4 text-slate-400" width="20" height="20"></i><input required type="number" step="0.01" className="w-full p-4 pl-12 bg-slate-50 rounded-xl border border-slate-200 outline-none" value={formData.revenue} onChange={e => setFormData(prev => ({...prev, revenue: e.target.value}))} /></div></div>
                        </div>
                        <div><label className="block text-xs font-bold text-slate-500 mb-2 uppercase">Maskottchen</label><div className="flex flex-wrap gap-3">{MASCOTS.map(m => <button key={m} type="button" onClick={() => toggleMascot(m)} className={`px-4 py-2.5 rounded-xl text-sm font-bold border transition-all ${selectedMascots.includes(m) ? 'bg-indigo-600 text-white shadow-md' : 'bg-slate-50 text-slate-600'}`}>{m} {selectedMascots.includes(m) && "✓"}</button>)}</div></div>
                        <div><label className="block text-xs font-bold text-slate-500 mb-2 uppercase">Mitarbeiter</label><div className="relative"><i data-lucide="user-check" className="absolute left-4 top-4 text-slate-400" width="20" height="20"></i><input type="text" className="w-full p-4 pl-12 bg-slate-50 rounded-xl border border-slate-200 outline-none" value={formData.assignee} onChange={e => setFormData(prev => ({...prev, assignee: e.target.value}))} /></div></div>
                        <div>
                            <div className="flex justify-between items-end mb-2">
                                <label className="block text-xs font-bold text-slate-500 uppercase">Notizen</label>
                                <button type="button" onClick={handleAIGenerate} disabled={isGenerating} className="text-xs font-bold text-purple-600 bg-purple-50 px-3 py-1.5 rounded-lg flex items-center border border-purple-200">
                                    {isGenerating ? <><i data-lucide="loader-2" width="12" height="12" className="mr-1 animate-spin"></i> ...</> : <><i data-lucide="sparkles" width="12" height="12" className="mr-1"></i> AI Planer</>}
                                </button>
                            </div>
                            <textarea rows="4" className="w-full p-4 bg-slate-50 rounded-xl border border-slate-200 outline-none" value={formData.notes} onChange={e => setFormData(prev => ({...prev, notes: e.target.value}))}></textarea>
                        </div>
                        <div className="flex space-x-4 pt-4"><button type="button" onClick={onCancel} className="px-8 py-4 bg-slate-100 text-slate-600 font-bold rounded-xl hover:bg-slate-200">Abbrechen</button><button type="submit" className="flex-1 bg-indigo-600 text-white font-bold py-4 rounded-xl shadow-lg hover:bg-indigo-700 flex items-center justify-center text-lg"><i data-lucide="plus-circle" width="24" height="24" className="mr-2"></i> Speichern</button></div>
                    </form>
                </div>
            );
        };

        const ListView = ({ bookings, onDeleteRequest, onToggleStatus }) => {
            const [listType, setListType] = React.useState('open');
            const [filterMascot, setFilterMascot] = React.useState('Alle');
            const [filterMonth, setFilterMonth] = React.useState('Alle');
            const availableMonths = [...new Set(bookings.map(b => getMonthName(b.date)))].sort();
            const filtered = bookings.filter(b => (listType === 'open' ? b.status !== 'completed' : b.status === 'completed') && (filterMascot === 'Alle' || (Array.isArray(b.mascot) ? b.mascot.includes(filterMascot) : b.mascot === filterMascot)) && (filterMonth === 'Alle' || getMonthName(b.date) === filterMonth)).sort((a, b) => new Date(b.date) - new Date(a.date));

            return (
                <div className="animate-fade-in space-y-6">
                    <div className="flex flex-col md:flex-row justify-between items-center gap-4 bg-white p-4 rounded-2xl shadow-sm border border-slate-100">
                        <div className="flex bg-slate-100 p-1.5 rounded-xl w-full md:w-auto">
                            <button onClick={() => setListType('open')} className={`flex-1 md:flex-none px-6 py-2 text-sm font-bold rounded-lg transition-all ${listType === 'open' ? 'bg-white text-indigo-600 shadow-sm' : 'text-slate-500'}`}>Offen</button>
                            <button onClick={() => setListType('completed')} className={`flex-1 md:flex-none px-6 py-2 text-sm font-bold rounded-lg transition-all ${listType === 'completed' ? 'bg-white text-green-600 shadow-sm' : 'text-slate-500'}`}>Erledigt</button>
                        </div>
                        <div className="flex space-x-3 w-full md:w-auto overflow-x-auto">
                            <select className="px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm font-semibold outline-none" value={filterMascot} onChange={e => setFilterMascot(e.target.value)}><option value="Alle">🎭 Alle</option>{MASCOTS.map(m => <option key={m} value={m}>{m}</option>)}</select>
                            <select className="px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm font-semibold outline-none" value={filterMonth} onChange={e => setFilterMonth(e.target.value)}><option value="Alle">📅 Alle</option>{availableMonths.map(m => <option key={m} value={m}>{m}</option>)}</select>
                        </div>
                    </div>
                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                        {filtered.length > 0 ? filtered.map(b => <BookingCard key={b.id} booking={b} onDeleteRequest={onDeleteRequest} onToggleStatus={onToggleStatus} />) : <div className="col-span-full p-20 text-center bg-slate-50 rounded-3xl border-2 border-dashed border-slate-200 text-slate-400">Keine Aufträge.</div>}
                    </div>
                </div>
            );
        };

        const ProfileView = ({ currentUser, onLogin, onLogout }) => {
            const [mode, setMode] = React.useState('login');
            const [formData, setFormData] = React.useState({ name: '', code: '' });
            const [error, setError] = React.useState('');

            const handleSubmit = (e) => {
                e.preventDefault();
                const name = formData.name.trim();
                const validCode = name.toLowerCase() === 'semih' ? SEMIH_CODE : TEAM_CODE;
                if (formData.code !== validCode) { setError("Falscher Code!"); return; }
                if (!name) { setError("Bitte Namen eingeben."); return; }
                onLogin(name);
            };

            if (currentUser) return (
                <div className="max-w-md mx-auto bg-white p-12 rounded-3xl shadow-xl text-center border border-slate-100 mt-12 animate-fade-in">
                    <div className="w-32 h-32 bg-indigo-100 rounded-full flex items-center justify-center mx-auto mb-6 shadow-inner"><i data-lucide="user-circle" width="80" height="80" className="text-indigo-600"></i></div>
                    <h2 className="text-4xl font-extrabold text-slate-800 mb-2">{currentUser.name}</h2>
                    <p className="text-indigo-600 font-semibold mb-8 bg-indigo-50 inline-block px-4 py-1.5 rounded-full">Team Mitglied</p>
                    <button onClick={onLogout} className="w-full py-4 rounded-2xl bg-slate-100 text-slate-600 font-bold hover:bg-red-50 hover:text-red-600 transition-colors flex items-center justify-center text-lg"><i data-lucide="log-out" width="22" height="22" className="mr-3"></i> Abmelden</button>
                </div>
            );

            return (
                <div className="max-w-md mx-auto mt-20 animate-fade-in">
                    <div className="text-center mb-10"><h1 className="text-4xl font-extrabold text-slate-900 tracking-tight mb-2">{mode === 'login' ? 'Willkommen' : 'Registrierung'}</h1><p className="text-slate-500 text-lg">ElegantEvent Management</p></div>
                    <div className="bg-white p-8 rounded-3xl shadow-2xl border border-slate-100">
                        <div className="flex bg-slate-100 p-1.5 rounded-2xl mb-8">
                            <button onClick={() => { setMode('login'); setError(''); }} className={`flex-1 py-3 text-sm font-bold rounded-xl transition-all flex justify-center items-center ${mode === 'login' ? 'bg-white shadow-sm text-indigo-600' : 'text-slate-500'}`}><i data-lucide="log-in" width="18" height="18" className="mr-2"></i> Anmelden</button>
                            <button onClick={() => { setMode('register'); setError(''); }} className={`flex-1 py-3 text-sm font-bold rounded-xl transition-all flex justify-center items-center ${mode === 'register' ? 'bg-white shadow-sm text-indigo-600' : 'text-slate-500'}`}><i data-lucide="user-plus" width="18" height="18" className="mr-2"></i> Registrieren</button>
                        </div>
                        <form onSubmit={handleSubmit} className="space-y-6">
                            {error && <div className="bg-red-50 text-red-600 p-4 rounded-xl text-sm flex items-center font-bold"><i data-lucide="alert-circle" width="20" height="20" className="mr-3"></i>{error}</div>}
                            <div><label className="block text-xs font-bold text-slate-500 mb-2 uppercase">Name</label><input type="text" className="w-full p-4 bg-slate-50 rounded-xl border border-slate-200 outline-none" placeholder="z.B. Max" value={formData.name} onChange={e => setFormData({...formData, name: e.target.value})} /></div>
                            <div><label className="block text-xs font-bold text-slate-500 mb-2 uppercase">Code</label><div className="relative"><i data-lucide="lock" className="absolute left-4 top-4 text-slate-400" width="20" height="20"></i><input type="password" className="w-full p-4 pl-12 bg-slate-50 rounded-xl border border-slate-200 outline-none" placeholder="••••••" value={formData.code} onChange={e => setFormData({...formData, code: e.target.value})} /></div></div>
                            <button type="submit" className="w-full bg-indigo-600 text-white font-bold py-4 rounded-xl shadow-lg hover:bg-indigo-700 transition-transform active:scale-[0.98] text-lg">{mode === 'login' ? 'Anmelden' : 'Konto erstellen'}</button>
                        </form>
                    </div>
                </div>
            );
        };

        const App = () => {
            const [activeTab, setActiveTab] = React.useState('profile');
            const [bookings, setBookings] = React.useState([]);
            const [currentUser, setCurrentUser] = React.useState(null);
            const [isLoaded, setIsLoaded] = React.useState(false);
            const [toast, setToast] = React.useState(null);
            const [deleteModalOpen, setDeleteModalOpen] = React.useState(false);
            const [itemToDelete, setItemToDelete] = React.useState(null);
            const [isOffline, setIsOffline] = React.useState(false);

            useLucide(); 

            const connectToFirebase = React.useCallback(async () => {
                try {
                    await signInAnonymously(auth);
                    const unsubscribe = onSnapshot(collection(db, 'bookings'), (snapshot) => {
                        const loaded = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                        setBookings(loaded);
                        setIsLoaded(true);
                        setIsOffline(false);
                    }, (error) => {
                        console.warn("DB Connection failed", error);
                        setIsOffline(true);
                    });
                    return unsubscribe;
                } catch (error) {
                    console.log("Auth failed:", error.code);
                    setIsOffline(true);
                    if (error.code === 'auth/configuration-not-found') {
                         setToast({ message: "Firebase Auth fehlt noch (Anonym aktivieren)", type: "warning" });
                    }
                }
            }, []);

            React.useEffect(() => {
                const savedUser = localStorage.getItem('mascot_user');
                if (savedUser) { setCurrentUser(JSON.parse(savedUser)); setActiveTab('dashboard'); }

                const savedData = localStorage.getItem('mascot_bookings');
                if (savedData) { setBookings(JSON.parse(savedData)); setIsLoaded(true); }

                let unsub;
                connectToFirebase().then(u => unsub = u);
                return () => unsub && unsub();
            }, [connectToFirebase]);

            React.useEffect(() => { if (isLoaded) localStorage.setItem('mascot_bookings', JSON.stringify(bookings)); }, [bookings, isLoaded]);
            React.useEffect(() => { if (currentUser) localStorage.setItem('mascot_user', JSON.stringify(currentUser)); else localStorage.removeItem('mascot_user'); }, [currentUser]);

            const addBooking = async (bookingData) => {
                setBookings(prev => [bookingData, ...prev]);
                setActiveTab('list');
                if (!isOffline) {
                    try {
                        const { id, ...data } = bookingData; 
                        await addDoc(collection(db, 'bookings'), data);
                        setToast({ message: "Gespeichert & Synchronisiert!", type: "success" });
                    } catch (e) { console.error(e); setToast({ message: "Nur lokal gespeichert", type: "warning" }); }
                } else {
                    setToast({ message: "Lokal gespeichert", type: "success" });
                }
            };

            const confirmDelete = async () => {
                if (itemToDelete) {
                    setBookings(prev => prev.filter(b => b.id !== itemToDelete));
                    if (!isOffline) {
                        try { await deleteDoc(doc(db, 'bookings', itemToDelete)); setToast({ message: "Gelöscht", type: "success" }); } 
                        catch (e) { console.error(e); setToast({ message: "Offline gelöscht", type: "warning" }); }
                    }
                }
                setDeleteModalOpen(false); setItemToDelete(null);
            };

            const toggleStatus = async (id) => {
                setBookings(prev => prev.map(b => b.id === id ? { ...b, status: b.status === 'completed' ? 'open' : 'completed' } : b));
                if (!isOffline) {
                    const booking = bookings.find(b => b.id === id);
                    if (booking) {
                        try { await updateDoc(doc(db, 'bookings', id), { status: booking.status === 'completed' ? 'open' : 'completed' }); } catch (e) { console.error(e); }
                    }
                }
            };

            const handleLogin = (name) => { setCurrentUser({ name }); setActiveTab('dashboard'); setToast({ message: `Hallo ${name}!`, type: "success" }); };
            const handleLogout = () => { setCurrentUser(null); setActiveTab('profile'); };
            const manualRetry = () => { setToast({ message: "Verbinde...", type: "success" }); connectToFirebase(); };

            const stats = React.useMemo(() => {
                const now = new Date();
                const currentMonth = now.getMonth();
                const currentYear = now.getFullYear();
                const revenueMonth = bookings.filter(b => { const d = new Date(b.date); return d.getMonth() === currentMonth && d.getFullYear() === currentYear; }).reduce((sum, b) => sum + Number(b.revenue), 0);
                const revenueYear = bookings.filter(b => new Date(b.date).getFullYear() === currentYear).reduce((sum, b) => sum + Number(b.revenue), 0);
                const upcoming = bookings.filter(b => b.status !== 'completed' && new Date(b.date) > now).sort((a, b) => new Date(a.date) - new Date(b.date));
                return { revenueMonth, revenueYear, openCount: bookings.filter(b => b.status !== 'completed').length, completedCount: bookings.filter(b => b.status === 'completed').length, nextThree: upcoming.slice(0, 3) };
            }, [bookings]);

            const historyData = React.useMemo(() => {
                const groups = {};
                bookings.forEach(b => {
                    const d = new Date(b.date);
                    const key = `${d.getFullYear()}-${d.getMonth()}`;
                    if (!groups[key]) groups[key] = { monthName: d.toLocaleDateString('de-DE', { month: 'long', year: 'numeric' }), revenue: 0, count: 0, sortKey: d.getTime() };
                    groups[key].revenue += Number(b.revenue); groups[key].count += 1;
                });
                return Object.values(groups).sort((a, b) => b.sortKey - a.sortKey).slice(0, 6);
            }, [bookings]);

            return (
                <div className="min-h-screen bg-slate-50 font-sans text-slate-900 flex flex-col">
                    {toast && <Toast message={toast.message} type={toast.type} onClose={() => setToast(null)} />}
                    <ConfirmModal isOpen={deleteModalOpen} title="Wirklich löschen?" message="Dies kann nicht rückgängig gemacht werden." onConfirm={confirmDelete} onCancel={() => setDeleteModalOpen(false)} />
                    
                    <nav className="bg-white border-b border-slate-200 sticky top-0 z-[50]">
                        <div className="container mx-auto px-6 h-20 flex items-center justify-between">
                            <div className="flex items-center space-x-3 cursor-pointer" onClick={() => setActiveTab('dashboard')}>
                                <div className="w-10 h-10 bg-indigo-600 rounded-xl flex items-center justify-center shadow-lg"><span className="text-2xl">🎭</span></div>
                                <div><h1 className="text-xl font-extrabold text-slate-900 leading-none">ElegantEvent</h1><p className="text-xs text-indigo-600 font-bold uppercase">Management</p></div>
                            </div>
                            {currentUser && (
                                <div className="hidden md:flex items-center space-x-2 bg-slate-50 p-1.5 rounded-2xl border border-slate-100">
                                    <button onClick={() => setActiveTab('dashboard')} className={`flex items-center px-5 py-2.5 rounded-xl text-sm font-bold transition-all ${activeTab === 'dashboard' ? 'bg-white text-indigo-600 shadow-sm' : 'text-slate-500 hover:text-slate-900'}`}><i data-lucide="layout-dashboard" className="mr-2" width="18"></i> Dashboard</button>
                                    <button onClick={() => setActiveTab('list')} className={`flex items-center px-5 py-2.5 rounded-xl text-sm font-bold transition-all ${activeTab === 'list' ? 'bg-white text-indigo-600 shadow-sm' : 'text-slate-500 hover:text-slate-900'}`}><i data-lucide="list" className="mr-2" width="18"></i> Liste</button>
                                    <button onClick={() => setActiveTab('finance')} className={`flex items-center px-5 py-2.5 rounded-xl text-sm font-bold transition-all ${activeTab === 'finance' ? 'bg-white text-indigo-600 shadow-sm' : 'text-slate-500 hover:text-slate-900'}`}><i data-lucide="pie-chart" className="mr-2" width="18"></i> Finanzen</button>
                                </div>
                            )}
                            <div className="flex items-center space-x-4">
                                {currentUser && <button onClick={() => setActiveTab('add')} className="hidden md:flex items-center px-6 py-3 bg-indigo-600 text-white rounded-xl font-bold shadow-lg hover:bg-indigo-700 active:scale-95 transition-transform"><i data-lucide="plus-circle" width="20" height="20" className="mr-2"></i> Neuer Auftrag</button>}
                                {currentUser ? <button onClick={() => setActiveTab('profile')} className="flex items-center space-x-3 px-3 py-2 hover:bg-slate-50 rounded-xl transition-colors"><div className="text-right hidden md:block"><span className="block text-sm font-bold text-slate-800">{currentUser.name}</span><span className="block text-xs text-indigo-600 font-medium">Team</span></div><div className="w-10 h-10 bg-indigo-100 rounded-full flex items-center justify-center text-indigo-700 font-bold border-2 border-white shadow-sm ring-2 ring-indigo-50">{currentUser.name.charAt(0).toUpperCase()}</div></button> : <span className="text-sm font-bold text-slate-400 flex items-center"><i data-lucide="lock" width="16" height="16" className="mr-1.5"></i> Login</span>}
                            </div>
                        </div>
                        {currentUser && (
                            <div className="md:hidden fixed bottom-0 left-0 w-full bg-white border-t border-slate-200 pb-safe z-50 px-6 py-3 flex justify-between items-center shadow-[0_-10px_40px_rgba(0,0,0,0.05)]">
                                <button onClick={() => setActiveTab('dashboard')} className={`flex flex-col items-center ${activeTab === 'dashboard' ? 'text-indigo-600' : 'text-slate-400'}`}><i data-lucide="layout-dashboard" width="24" height="24"></i><span className="text-[10px] font-bold mt-1">Home</span></button>
                                <button onClick={() => setActiveTab('list')} className={`flex flex-col items-center ${activeTab === 'list' ? 'text-indigo-600' : 'text-slate-400'}`}><i data-lucide="list" width="24" height="24"></i><span className="text-[10px] font-bold mt-1">Liste</span></button>
                                <button onClick={() => setActiveTab('add')} className="relative -top-6 bg-indigo-600 text-white p-4 rounded-full shadow-lg border-4 border-slate-50"><i data-lucide="plus-circle" width="28" height="28"></i></button>
                                <button onClick={() => setActiveTab('finance')} className={`flex flex-col items-center ${activeTab === 'finance' ? 'text-indigo-600' : 'text-slate-400'}`}><i data-lucide="pie-chart" width="24" height="24"></i><span className="text-[10px] font-bold mt-1">Finanzen</span></button>
                                <button onClick={() => setActiveTab('profile')} className={`flex flex-col items-center ${activeTab === 'profile' ? 'text-indigo-600' : 'text-slate-400'}`}><i data-lucide="user-circle" width="24" height="24"></i><span className="text-[10px] font-bold mt-1">Konto</span></button>
                            </div>
                        )}
                    </nav>

                    <main className="container mx-auto px-4 md:px-6 py-8 flex-1 mb-20 md:mb-0">
                        {!currentUser ? <ProfileView currentUser={currentUser} onLogin={handleLogin} onLogout={handleLogout} /> : (
                            <>
                                {activeTab === 'dashboard' && <DashboardView stats={stats} onDeleteRequest={requestDelete} onToggleStatus={toggleStatus} currentUser={currentUser} />}
                                {activeTab === 'list' && <ListView bookings={bookings} onDeleteRequest={requestDelete} onToggleStatus={toggleStatus} />}
                                {activeTab === 'finance' && <FinancialView stats={stats} historyData={historyData} />}
                                {activeTab === 'profile' && <ProfileView currentUser={currentUser} onLogin={handleLogin} onLogout={handleLogout} />}
                                {activeTab === 'add' && <AddFormView onAdd={addBooking} onCancel={() => setActiveTab('dashboard')} currentUser={currentUser} />}
                            </>
                        )}
                    </main>
                    <div className="hidden md:flex justify-center items-center py-6 text-center text-slate-400 text-xs font-medium border-t border-slate-100">
                        <span className="mr-2">ElegantEvent Manager v2.1 •</span>
                        <span className={`inline-flex items-center ${isOffline ? 'text-amber-500' : 'text-green-600'}`}>
                            <i data-lucide={isOffline ? "cloud-off" : "cloud"} width="12" height="12" className="mr-1"></i> {isOffline ? 'Offline (Lokal)' : 'Online (Firebase)'}
                        </span>
                        {isOffline && (
                            <button onClick={manualRetry} className="ml-3 px-2 py-1 bg-amber-50 text-amber-700 rounded border border-amber-200 hover:bg-amber-100 transition-colors">
                                Verbinden
                            </button>
                        )}
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
